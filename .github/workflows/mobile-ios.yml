name: Mobile iOS Build

on:
  push:
    branches: [main]
    paths:
      - 'leanshot/apps/ios/**'
      - 'leanshot/src/**'
      - 'leanshot/package.json'
      - 'leanshot/package-lock.json'
      - 'leanshot/capacitor.config.ts'
      - 'leanshot/fastlane/**'
      - '.github/workflows/mobile-ios.yml'
  pull_request:
    branches: [main]
    paths:
      - 'leanshot/apps/ios/**'
      - 'leanshot/src/**'
      - 'leanshot/package.json'
      - 'leanshot/package-lock.json'
      - 'leanshot/capacitor.config.ts'
      - 'leanshot/fastlane/**'
      - '.github/workflows/mobile-ios.yml'

  # WR-02: global concurrency block removed — upload jobs must not be cancelled.
  # Job-level concurrency is applied to build-ios only (see below).

defaults:
  run:
    working-directory: leanshot

jobs:
  build-ios:
    name: Build iOS (unsigned, always green)
    runs-on: macos-latest
    timeout-minutes: 30
    concurrency:
      group: mobile-ios-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: leanshot/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build unsigned iOS archive (xcodebuild)
        run: |
          xcodebuild \
            -workspace apps/ios/App/App.xcodeproj/project.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath derived_data \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

  # Preflight gate. Neither `secrets` nor `env` is available in a job-level `if:`
  # (only github/needs/vars/inputs are) — a job-level `if: env.* != ''` is an
  # "Invalid workflow file" error that startup-fails the ENTIRE workflow (0 jobs
  # run, including build-ios). So expose secret-presence as a job output and gate
  # the upload job via `needs`, which IS allowed in a job-level `if:`.
  check-secrets:
    name: Check Apple signing secrets present
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        working-directory: ${{ github.workspace }}  # no checkout; override the leanshot default
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD }}
        run: |
          if [ -n "$APPLE_CERTIFICATE_BASE64" ] && [ -n "$FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

  sign-and-upload-ios:
    name: Sign and upload to TestFlight (gated)
    needs: [build-ios, check-secrets]
    if: needs.check-secrets.outputs.enabled == 'true'
    runs-on: macos-latest
    env:
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      # WR-01: FASTLANE_USER + FASTLANE_TEAM_ID required by match() and pilot()
      FASTLANE_USER: ${{ secrets.FASTLANE_USER }}
      FASTLANE_TEAM_ID: ${{ secrets.FASTLANE_TEAM_ID }}
      # §6.1: the Gemfile lives at leanshot/fastlane/Gemfile (there is no leanshot/Gemfile);
      # without this, ruby/setup-ruby's bundler-cache + `bundle exec` fail with
      # "Could not locate Gemfile" (mirrors the mobile-android.yml fix from #23).
      BUNDLE_GEMFILE: ${{ github.workspace }}/leanshot/fastlane/Gemfile
    steps:
      - uses: actions/checkout@v4

      # CR-01: web-asset pipeline must run on this runner before gym() can build.
      # The build-ios job runs on a separate runner whose artifacts are not
      # transferred here — this job must be self-contained.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: leanshot/package-lock.json

      - name: Install dependencies
        working-directory: leanshot
        run: npm ci --legacy-peer-deps

      - name: Build web assets
        working-directory: leanshot
        run: npm run build

      - name: Sync Capacitor iOS
        working-directory: leanshot
        run: npx cap sync ios

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: leanshot

      - name: Set up Fastlane CI environment
        working-directory: leanshot
        run: bundle exec fastlane run setup_ci

      - name: Upload to TestFlight
        working-directory: leanshot
        run: bundle exec fastlane upload_testflight
