name: Mobile Android Build

on:
  push:
    branches: [main]
    paths:
      - 'leanshot/apps/android/**'
      - 'leanshot/src/**'
      - 'leanshot/package.json'
      - 'leanshot/package-lock.json'
      - 'leanshot/capacitor.config.ts'
      - 'leanshot/fastlane/**'
      - '.github/workflows/mobile-android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'leanshot/apps/android/**'
      - 'leanshot/src/**'
      - 'leanshot/package.json'
      - 'leanshot/package-lock.json'
      - 'leanshot/capacitor.config.ts'
      - 'leanshot/fastlane/**'
      - '.github/workflows/mobile-android.yml'

  # WR-02: global concurrency block removed — upload jobs must not be cancelled.
  # Job-level concurrency is applied to build-android only (see below).

defaults:
  run:
    working-directory: leanshot

jobs:
  build-android:
    name: Build Android AAB (unsigned, always green)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: mobile-android-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: leanshot/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor Android
        # MUST run before gradlew so that apps/android/app/src/main/assets exists
        run: npx cap sync android

      - name: Build unsigned AAB (:app:bundleRelease)
        working-directory: leanshot/apps/android
        # Scope to :app — the phone AAB is the Play deliverable and is independent of :wear
        # (no wearApp dependency). The :wear module is an explicit "SCAFFOLD ONLY" (its tile
        # code is deferred per CONTEXT D-08 and doesn't yet compile against tiles 1.6.0), so
        # building all modules via `bundleRelease` would fail on :wear:compileReleaseKotlin.
        # The app's release buildType has no signingConfig, so this produces an UNSIGNED AAB.
        # Do NOT pass empty -Pandroid.injected.signing.* flags: AGP treats them as a (broken,
        # empty) injected signing config and fails :app:validateSigningRelease.
        run: ./gradlew :app:bundleRelease

  # Preflight gate. Neither `secrets` nor `env` is available in a job-level `if:`
  # (only github/needs/vars/inputs are) — a job-level `if: env.* != ''` is an
  # "Invalid workflow file" error that startup-fails the ENTIRE workflow (0 jobs
  # run, including build-android). So expose secret-presence as a job output and
  # gate the upload job via `needs`, which IS allowed in a job-level `if:`.
  check-secrets:
    name: Check Play signing secrets present
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        working-directory: ${{ github.workspace }}  # no checkout; override the leanshot default
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

  sign-and-upload-android:
    name: Sign and upload to Play Store (gated)
    needs: [build-android, check-secrets]
    if: needs.check-secrets.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      # §6.1: the Gemfile lives at leanshot/fastlane/Gemfile (not leanshot/Gemfile);
      # point bundler at it (absolute → robust across step working-directories).
      BUNDLE_GEMFILE: ${{ github.workspace }}/leanshot/fastlane/Gemfile
    steps:
      - uses: actions/checkout@v4

      # CR-02: web-asset pipeline must run on this runner before gradle can build.
      # The build-android job runs on a separate runner whose artifacts are not
      # transferred here — this job must be self-contained.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: leanshot/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        working-directory: leanshot
        run: npm ci --legacy-peer-deps

      - name: Build web assets
        working-directory: leanshot
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: leanshot
        run: npx cap sync android

      - name: Decode keystore
        working-directory: leanshot
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > apps/android/app/leanshot-release.jks

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: leanshot

      - name: Upload to Play Store
        working-directory: leanshot
        run: bundle exec fastlane upload_play
