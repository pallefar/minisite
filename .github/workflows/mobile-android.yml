name: Mobile Android Build

on:
  push:
    branches: [main]
    paths:
      - 'leanshot/apps/android/**'
      - 'leanshot/src/**'
      - 'leanshot/package.json'
      - 'leanshot/package-lock.json'
      - 'leanshot/capacitor.config.ts'
      - 'leanshot/fastlane/**'
      - '.github/workflows/mobile-android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'leanshot/apps/android/**'
      - 'leanshot/src/**'
      - 'leanshot/package.json'
      - 'leanshot/package-lock.json'
      - 'leanshot/capacitor.config.ts'
      - 'leanshot/fastlane/**'
      - '.github/workflows/mobile-android.yml'

  # WR-02: global concurrency block removed — upload jobs must not be cancelled.
  # Job-level concurrency is applied to build-android only (see below).

defaults:
  run:
    working-directory: leanshot

jobs:
  build-android:
    name: Build Android AAB (unsigned, always green)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: mobile-android-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: leanshot/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build web assets
        # H1: inject the RevenueCat PUBLIC Android SDK key at build time. Vite freezes
        # import.meta.env.VITE_RC_API_KEY_ANDROID into the bundle here; without this the
        # shipped app has an empty key → configureRC() throws → dead paywall.
        env:
          VITE_RC_API_KEY_ANDROID: ${{ secrets.VITE_RC_API_KEY_ANDROID }}
        run: npm run build

      - name: Sync Capacitor Android
        # MUST run before gradlew so that apps/android/app/src/main/assets exists
        run: npx cap sync android

      - name: Build unsigned AAB (bundleRelease)
        working-directory: leanshot/apps/android
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="" \
            -Pandroid.injected.signing.store.password="" \
            -Pandroid.injected.signing.key.alias="" \
            -Pandroid.injected.signing.key.password=""

  sign-and-upload-android:
    name: Sign and upload to Play Store (gated)
    needs: build-android
    runs-on: ubuntu-latest
    # Gate: only run when Android signing + Play secrets are present.
    # GitHub forbids secrets.* in `if:` — map secrets to env first, then gate on env.
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    if: env.KEYSTORE_BASE64 != '' && env.PLAY_SERVICE_ACCOUNT_JSON != ''
    steps:
      - uses: actions/checkout@v4

      # CR-02: web-asset pipeline must run on this runner before gradle can build.
      # The build-android job runs on a separate runner whose artifacts are not
      # transferred here — this job must be self-contained.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: leanshot/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        working-directory: leanshot
        run: npm ci --legacy-peer-deps

      - name: Build web assets
        working-directory: leanshot
        # H1: same RC key injection on the upload runner (separate runner from
        # build-android; artifacts are not transferred, so this job rebuilds the bundle).
        env:
          VITE_RC_API_KEY_ANDROID: ${{ secrets.VITE_RC_API_KEY_ANDROID }}
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: leanshot
        run: npx cap sync android

      - name: Decode keystore
        working-directory: leanshot
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > apps/android/app/leanshot-release.jks

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: leanshot

      - name: Upload to Play Store
        working-directory: leanshot
        run: bundle exec fastlane upload_play
