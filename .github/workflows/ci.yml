name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same branch/PR on a new push (Discretion)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: leanshot

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: leanshot/package-lock.json
      - run: npm ci
      - run: npm run lint

  format-check:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: leanshot/package-lock.json
      - run: npm ci
      - run: npm run format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: leanshot/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  test-unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: leanshot/package-lock.json
      - run: npm ci
      - run: npm run test:unit
        env:
          # Phase 5 SC#5 (cross-tenant RLS on injections) — when these secrets
          # are present the e2e/rls-*.test.ts suites run live against the
          # remote DB and gate merge. If absent (forks, default PRs) the
          # tests self-skip via describeIfLive — see e2e/rls-injections.test.ts.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  test-e2e:
    name: E2E smoke + production-build security check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: leanshot/package-lock.json
      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      # Production-shaped build with explicitly empty env vars.
      # Asserts S-10: production build with empty Sentry DSN exits 0.
      # Phase 5: ALSO injects VITE_SUPABASE_* so the SPA bundle wired into
      # the Playwright preview can reach the live Supabase project. These
      # are bundled at build time (Vite resolves import.meta.env.* eagerly);
      # without them the bundle ships with placeholder.invalid and the
      # @phase05 e2e specs fall through to their skip-gates.
      - name: Build (production-shaped, empty env)
        run: npm run build
        env:
          VITE_SENTRY_DSN: ''
          VITE_POSTHOG_KEY: ''
          VITE_POSTHOG_HOST: ''
          VITE_ANALYTICS_ENABLED: 'false'
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      # Phase 2.1 SC#2 — vendor-react chunk-size regression guard.
      # If this step fails, vendor-react gz dropped below the floor (e.g.
      # react-dom collapsed back into the index chunk because vite.config.ts
      # was reverted from function-form to object-form manualChunks).
      # See:
      #   leanshot/.planning/phases/02.1-spa-lighthouse-perf/02.1-RESEARCH.md
      #   leanshot/scripts/assert-vendor-react-size.sh (threshold logic)
      # Working directory is `leanshot` (job default), so the relative path
      # resolves to leanshot/scripts/assert-vendor-react-size.sh.
      - name: Assert vendor-react chunk size (SC#2 — Phase 2.1 regression guard)
        run: bash scripts/assert-vendor-react-size.sh

      # Security check (T-1-05 mitigation): the dev-only Sentry trigger string
      # 'phase-1-sentry-smoke' MUST NOT appear in any production-built JS file.
      # Vite tree-shakes the import.meta.env.DEV branch out of production builds.
      # Note: scope to *.js only — source maps (introduced in Phase 2 Plan 02-07
      # via build.sourcemap: 'hidden') legitimately preserve the original .tsx
      # source verbatim including the dev-only string, but the *.js bundle
      # itself is what runs in the browser.
      - name: Security check — dev-only trigger absent from production build
        run: |
          if grep -r --include="*.js" "phase-1-sentry-smoke" dist/ ; then
            echo "FAIL: dev-only Sentry trigger 'phase-1-sentry-smoke' leaked into production bundle"
            exit 1
          fi

      - name: Run Playwright smoke against production build
        run: npm run test:e2e
        env:
          CI: 'true'
          # Phase 5: @phase05 specs (auth-signup-verify-signin, password-reset,
          # signout-cache-clear, cross-device-sync, offline-log-then-sync) read
          # these to spin up an admin client for createUser/deleteUser cleanup.
          # Without the secrets the specs self-skip via the HAS_LIVE_AUTH gate.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: leanshot/playwright-report/
          retention-days: 7

  compliance-copy:
    name: Compliance copy grep (CMIA AB 2089)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The repo-root `defaults.run.working-directory: leanshot` applies to this job too,
      # so `src` below resolves to `leanshot/src/`. No per-job override needed.

      # Phase 2 D-16/D-17 (SC#5): CMIA AB 2089 denylist for mental-health framing.
      # Grep semantics — RESEARCH gotcha #5:
      #   `grep` exits 0 on ANY match, 1 on NO match.
      #   The job's success condition is the OPPOSITE: success = NO match.
      #   Therefore the exit is INVERTED via `if grep …; then exit 1`.
      # Search root: `src` (resolves to leanshot/src/ via working-directory default).
      # Word-boundary regex `\b…\b` requires GNU grep -E; ubuntu-latest provides it.
      - name: Check for forbidden mental-health terms (CMIA AB 2089 — D-16)
        run: |
          if grep -rniE '\b(depression|anxiety|therapy|mental health treatment)\b' src \
               --include='*.ts' --include='*.tsx' \
               --exclude='*.test.ts' --exclude='*.test.tsx'; then
            echo "::error::Forbidden term found in user-facing string (SC#5 denylist)."
            echo "Allowed: 'mood' (Mood tab name). Disallowed: depression, anxiety, therapy, mental health treatment."
            exit 1
          fi

  deno-test:
    name: Deno tests (Edge Function refusal corpus)
    runs-on: ubuntu-latest
    # CRITICAL: override workflow-level defaults.run.working-directory: leanshot.
    # Phase 4 RESEARCH §"Pitfall 10". The repo-root supabase/ and shared/
    # directories are NOT visible if the working-directory is leanshot/.
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Verify dual-runtime refusal artifacts present
        run: |
          test -f shared/refusal.ts || (echo "FAIL: shared/refusal.ts missing" && exit 1)
          test -f supabase/functions/import_map.json || (echo "FAIL: import_map.json missing" && exit 1)
          test -f supabase/functions/tests/ai-chat-refusal.test.ts || (echo "FAIL: deno test file missing" && exit 1)
      - name: Run Deno tests (shared/refusal corpus under Deno runtime)
        run: deno test --allow-net=api.moonshot.ai --allow-read --allow-env --import-map=supabase/functions/import_map.json supabase/functions/tests/

  lighthouse:
    name: Lighthouse (Vercel preview)
    runs-on: ubuntu-latest
    needs: [lint, format-check, typecheck, test-unit, test-e2e, compliance-copy, deno-test]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Wait for Vercel preview deployment
        id: wait
        uses: patrickedqvist/wait-for-vercel-preview@v1.3.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          max_timeout: 300
          # Filter to the SPA project's GitHub check (RESEARCH P6 / SC#1).
          # Without this, the action returns the FIRST preview URL it finds,
          # which alphabetises to `leanshot-marketing` and causes lhci to score
          # the wrong site. Vercel's GitHub App posts one check per project;
          # this string must match the SPA project's exact check name.
          # Wave 5 verifies the exact dash character on a live PR; if this
          # value does not resolve, try `'leanshot-app - Vercel'` (hyphen).
          check_name: 'leanshot-app – Vercel'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: leanshot/package-lock.json
      - run: npm ci
      - name: Run Lighthouse against Vercel preview
        run: npx --yes @lhci/cli@0.15.1 autorun --collect.url=${{ steps.wait.outputs.url }}
        env:
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}
