name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same branch/PR on a new push (Discretion)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: leanshot

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: leanshot/package-lock.json
      - run: npm ci
      - run: npm run lint

  format-check:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: leanshot/package-lock.json
      - run: npm ci
      - run: npm run format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: leanshot/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  test-unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: leanshot/package-lock.json
      - run: npm ci
      - run: npm run test:unit
        env:
          # Phase 5 SC#5 (cross-tenant RLS on injections) — when these secrets
          # are present the e2e/rls-*.test.ts suites run live against the
          # remote DB and gate merge. If absent (forks, default PRs) the
          # tests self-skip via describeIfLive — see e2e/rls-injections.test.ts.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  test-e2e:
    name: E2E smoke + production-build security check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: leanshot/package-lock.json
      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      # ─────────────────────────────────────────────────────────────────────
      # Phase 8 Plan 08-06 — Static-import regression guard for the `share`
      # lazy chunk (HI-2 additive append, third append point in this file:
      # Plan 08-02 deno-test step → Plan 08-05 share-security-drill job →
      # this guard). The initial bundle budget gate is enforced in Plan
      # 08-04 Task 2b (HI-1) — this step's ONLY job is preventing future
      # PRs from accidentally static-importing `@/components/share/*` into
      # App.tsx or main.tsx, which would defeat the lazy-load and bloat
      # the index chunk back over its gz ceiling.
      #
      # See: leanshot/.planning/phases/08-doctor-read-share/08-06-PLAN.md
      # Memory: project_phase5_bundle_regression.md (50 kB gz ceiling).
      # ─────────────────────────────────────────────────────────────────────
      - name: Static-import guard for share routes (Phase 8 Plan 08-06)
        run: |
          if grep -rn "^import.*'@/components/share/" src/App.tsx src/main.tsx; then
            echo "FAIL: Static import of @/components/share/* found in App.tsx or main.tsx"
            echo "      SharePage MUST be React.lazy. See memory project_phase5_bundle_regression.md"
            exit 1
          fi
          echo "Static-import guard: PASS (no static @/components/share/* imports in App.tsx or main.tsx)"

      # Production-shaped build with explicitly empty env vars.
      # Asserts S-10: production build with empty Sentry DSN exits 0.
      # Phase 5: ALSO injects VITE_SUPABASE_* so the SPA bundle wired into
      # the Playwright preview can reach the live Supabase project. These
      # are bundled at build time (Vite resolves import.meta.env.* eagerly);
      # without them the bundle ships with placeholder.invalid and the
      # @phase05 e2e specs fall through to their skip-gates.
      - name: Build (production-shaped, empty env)
        run: npm run build
        env:
          VITE_SENTRY_DSN: ''
          VITE_POSTHOG_KEY: ''
          VITE_POSTHOG_HOST: ''
          VITE_ANALYTICS_ENABLED: 'false'
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # Phase 7 07-01 (Rule 3 deviation): opt the production-shaped CI
          # build into exposing `window.useStore` so specs #4 (offline-conflict-toast)
          # and #7 (signout-cache-clear) can drive store actions / read state
          # via `page.evaluate()`. Vercel production builds do NOT set this
          # flag, so the deployed bundle still hides the handle. See
          # leanshot/.planning/phases/07-compliance-foundations-legal-counsel-led/07-01-findings.md
          # §"Cross-cutting deviation".
          VITE_E2E: 'true'

      # Phase 2.1 SC#2 — vendor-react chunk-size regression guard.
      # If this step fails, vendor-react gz dropped below the floor (e.g.
      # react-dom collapsed back into the index chunk because vite.config.ts
      # was reverted from function-form to object-form manualChunks).
      # See:
      #   leanshot/.planning/phases/02.1-spa-lighthouse-perf/02.1-RESEARCH.md
      #   leanshot/scripts/assert-vendor-react-size.sh (threshold logic)
      # Working directory is `leanshot` (job default), so the relative path
      # resolves to leanshot/scripts/assert-vendor-react-size.sh.
      - name: Assert vendor-react chunk size (SC#2 — Phase 2.1 regression guard)
        run: bash scripts/assert-vendor-react-size.sh

      # Phase 7 Plan 07-06 — jspdf chunk topology guard.
      # Asserts: (a) dist/assets/jspdf*.js chunk exists separate from index,
      # (b) jspdf gz > 20 kB (sanity floor — catches tree-shake regressions),
      # (c) index chunk does NOT contain the jsPDF identifier (catches a
      # static-import regression that would bloat the entry chunk).
      # See:
      #   leanshot/.planning/phases/07-compliance-foundations-legal-counsel-led/07-06-PLAN.md
      #   leanshot/scripts/assert-bundle-budget.sh
      - name: Assert bundle budget (jspdf chunk topology — Phase 7 COMPL-06 guard)
        run: bash scripts/assert-bundle-budget.sh

      # Phase 12 Plan 12-01 D-13 — hash-hyphen regression test.
      # Verifies that the sed loop fix (Plan 10-11, lines 147-186 of
      # assert-clinic-bundle-budget.sh) still correctly strips Vite hashes
      # that contain internal hyphens (e.g. `clinic-invite-BsW-HOUO`).
      # Without this fix, hyphen-hash filenames silently trigger wave-0 skip
      # instead of being measured against their ceiling.
      # See: memory reference_bundle_budget_hash_hyphen.md
      - name: Hash-hyphen regression test (Phase 12 D-13)
        run: bash scripts/test-hash-hyphen-regression.sh

      # Security check (T-1-05 mitigation): the dev-only Sentry trigger string
      # 'phase-1-sentry-smoke' MUST NOT appear in any production-built JS file.
      # Vite tree-shakes the import.meta.env.DEV branch out of production builds.
      # Note: scope to *.js only — source maps (introduced in Phase 2 Plan 02-07
      # via build.sourcemap: 'hidden') legitimately preserve the original .tsx
      # source verbatim including the dev-only string, but the *.js bundle
      # itself is what runs in the browser.
      - name: Security check — dev-only trigger absent from production build
        run: |
          if grep -r --include="*.js" "phase-1-sentry-smoke" dist/ ; then
            echo "FAIL: dev-only Sentry trigger 'phase-1-sentry-smoke' leaked into production bundle"
            exit 1
          fi

      - name: Run Playwright smoke against production build
        run: npm run test:e2e
        env:
          CI: 'true'
          # Phase 5: @phase05 specs (auth-signup-verify-signin, password-reset,
          # signout-cache-clear, cross-device-sync, offline-log-then-sync) read
          # these to spin up an admin client for createUser/deleteUser cleanup.
          # Without the secrets the specs self-skip via the HAS_LIVE_AUTH gate.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # ─────────────────────────────────────────────────────────────────────
      # Phase 12 Plan 12-03 SC-3 (D-14/D-15) — Clinic ad-free e2e gate.
      # Asserts zero ad-provider scripts, zero <AdSlot> mounts, and zero
      # ad-provider network requests on /clinic/*, /share/*, /admin/* routes.
      # Three-layer defense per cross-cutting concern #2 (CCC-2):
      #   AD-03 component refusal + AD-02 Edge Function refusal +
      #   CSP report-only + THIS Playwright gate.
      # The spec trivially passes in Phase 12 (no ads anywhere). It becomes
      # a real safety net when Phase 20 ships ad code — preventing accidental
      # inclusion on B2B surfaces from reaching main.
      # See: leanshot/e2e/clinic-ad-free.spec.ts
      # ─────────────────────────────────────────────────────────────────────
      - name: Phase 12 SC-3 — Clinic ad-free e2e gate
        run: npx playwright test e2e/clinic-ad-free.spec.ts --reporter=line
        env:
          CI: 'true'

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: leanshot/playwright-report/
          retention-days: 7

  compliance-copy:
    name: Compliance copy grep (CMIA AB 2089)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The repo-root `defaults.run.working-directory: leanshot` applies to this job too,
      # so `src` below resolves to `leanshot/src/`. No per-job override needed.

      # Phase 2 D-16/D-17 (SC#5): CMIA AB 2089 denylist for mental-health framing.
      # Grep semantics — RESEARCH gotcha #5:
      #   `grep` exits 0 on ANY match, 1 on NO match.
      #   The job's success condition is the OPPOSITE: success = NO match.
      #   Therefore the exit is INVERTED via `if grep …; then exit 1`.
      # Search root: `src` (resolves to leanshot/src/ via working-directory default).
      # Word-boundary regex `\b…\b` requires GNU grep -E; ubuntu-latest provides it.
      - name: Check for forbidden mental-health terms (CMIA AB 2089 — D-16)
        run: |
          if grep -rniE '\b(depression|anxiety|therapy|mental health treatment)\b' src \
               --include='*.ts' --include='*.tsx' \
               --exclude='*.test.ts' --exclude='*.test.tsx'; then
            echo "::error::Forbidden term found in user-facing string (SC#5 denylist)."
            echo "Allowed: 'mood' (Mood tab name). Disallowed: depression, anxiety, therapy, mental health treatment."
            exit 1
          fi

  deno-test:
    name: Deno tests (Edge Function refusal corpus)
    runs-on: ubuntu-latest
    # CRITICAL: override workflow-level defaults.run.working-directory: leanshot.
    # Phase 4 RESEARCH §"Pitfall 10". The repo-root supabase/ and shared/
    # directories are NOT visible if the working-directory is leanshot/.
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Verify dual-runtime refusal artifacts present
        run: |
          test -f shared/refusal.ts || (echo "FAIL: shared/refusal.ts missing" && exit 1)
          test -f supabase/functions/import_map.json || (echo "FAIL: import_map.json missing" && exit 1)
          test -f supabase/functions/tests/ai-chat-refusal.test.ts || (echo "FAIL: deno test file missing" && exit 1)
      - name: Run Deno tests (shared/refusal corpus under Deno runtime)
        run: deno test --allow-net=api.moonshot.ai --allow-read --allow-env --import-map=supabase/functions/import_map.json supabase/functions/tests/
      - name: Run Deno tests (share Edge Function — Plan 08-02)
        run: deno test --allow-all --import-map=supabase/functions/import_map.json supabase/functions/share/

  # ─────────────────────────────────────────────────────────────────────────
  # Phase 8 Plan 08-05 — 4-failure-mode revocation drill (SC#3) + extended
  # RLS proof for the `shares` surface. HI-2 ADDITIVE APPEND: this job is
  # appended AFTER the deno-test job's Plan 08-02 step; Plan 08-06's executor
  # MUST also append independently rather than consolidating these. See
  # leanshot/.planning/phases/08-doctor-read-share/08-05-PLAN.md HI-2.
  #
  # Required for merge to main — configure via branch protection (note in
  # Plan 08-05 SUMMARY surfaces this for the user to apply manually; GitHub
  # branch-protection rules are not workflow-defined).
  # ─────────────────────────────────────────────────────────────────────────
  share-security-drill:
    name: Share security drill (SC#3 4-failure-mode + RLS proof)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: leanshot/package-lock.json
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
      # Production-shaped build so the doctor-share lazy chunk is served from
      # the same preview server that handles share-happy-path. VITE_E2E=true
      # exposes window.useStore (Phase 7 07-01 deviation, pattern reused).
      - name: Build (production-shaped)
        run: npm run build
        env:
          VITE_SENTRY_DSN: ''
          VITE_POSTHOG_KEY: ''
          VITE_POSTHOG_HOST: ''
          VITE_ANALYTICS_ENABLED: 'false'
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_E2E: 'true'
      - name: Run revocation drill (Playwright)
        run: npx playwright test e2e/share-revocation-drill.spec.ts
        env:
          CI: 'true'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Run extended RLS proof (Vitest)
        run: npx vitest run --config vitest-e2e.config.ts e2e/rls-shares.test.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Upload drill artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: share-drill-results
          path: |
            leanshot/playwright-report/
            leanshot/test-results/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # Phase 10 Plan 10-11 — SC#5 roster-perf gate.
  # Appended AFTER share-security-drill (HI-2 additive convention from memory
  # `feedback_planner_iter1_anti_patterns.md`). Validates that a 50-patient
  # roster renders within 2000ms on the Vercel preview deploy (D-10, D-11).
  #
  # Path-scoped: only runs on PRs that touch clinic components, migrations, or
  # Edge Functions relevant to the roster render path. Uses a `get-changed-files`
  # step to implement the path filter at job level (GitHub Actions does not
  # support native per-job path triggers; only the on.push/pull_request.paths
  # filter exists at workflow level, which would scope ALL jobs).
  #
  # Seeds 50 synthetic patients via service-role bypass → runs Playwright
  # roster-perf spec → cleanup happens inside the spec's afterAll.
  #
  # Estimated runtime: ~3 min (30-60s seed + ~1min spec + teardown).
  # ─────────────────────────────────────────────────────────────────────────
  roster-perf:
    name: Roster perf (50-patient SC#5)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [share-security-drill]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Determine changed files to scope this job to Phase 10 roster paths only.
      # If no relevant files changed, the spec is skipped via the path-check step.
      - name: Get changed files
        id: changed
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD 2>/dev/null || echo "")
          echo "files=$CHANGED" >> "$GITHUB_OUTPUT"
          RELEVANT=false
          while IFS= read -r f; do
            case "$f" in
              leanshot/src/components/clinic/*) RELEVANT=true; break ;;
              supabase/migrations/*roster*.sql) RELEVANT=true; break ;;
              supabase/migrations/20260901000003_*.sql) RELEVANT=true; break ;;
              supabase/migrations/20260901000004_*.sql) RELEVANT=true; break ;;
              supabase/functions/clinic-snapshot/*) RELEVANT=true; break ;;
              supabase/functions/bulk-csv-export/*) RELEVANT=true; break ;;
            esac
          done <<< "$CHANGED"
          echo "relevant=$RELEVANT" >> "$GITHUB_OUTPUT"
          echo "Roster-perf path gate: relevant=$RELEVANT"

      - uses: actions/setup-node@v4
        if: steps.changed.outputs.relevant == 'true'
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: leanshot/package-lock.json

      - name: Install dependencies
        if: steps.changed.outputs.relevant == 'true'
        run: npm ci

      - name: Install Playwright Chromium
        if: steps.changed.outputs.relevant == 'true'
        run: npx playwright install chromium --with-deps

      # Production-shaped build so the clinic lazy chunk serves from the
      # same preview server. VITE_E2E=true exposes window.useStore (Phase 7 pattern).
      - name: Build (production-shaped)
        if: steps.changed.outputs.relevant == 'true'
        run: npm run build
        env:
          VITE_SENTRY_DSN: ''
          VITE_POSTHOG_KEY: ''
          VITE_POSTHOG_HOST: ''
          VITE_ANALYTICS_ENABLED: 'false'
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_E2E: 'true'

      - name: Wait for Vercel preview deployment
        id: wait
        if: steps.changed.outputs.relevant == 'true'
        uses: patrickedqvist/wait-for-vercel-preview@v1.3.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          max_timeout: 300
          check_name: 'leanshot-app – Vercel'

      - name: Run roster-perf spec (SC#5 50-patient render < 2s)
        if: steps.changed.outputs.relevant == 'true'
        run: npx playwright test e2e/roster-perf.spec.ts
        env:
          CI: 'true'
          PLAYWRIGHT_BASE_URL: ${{ steps.wait.outputs.url }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Upload roster-perf artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: roster-perf-results
          path: |
            leanshot/playwright-report/
            leanshot/test-results/
          retention-days: 7

  lighthouse:
    name: Lighthouse (Vercel preview)
    runs-on: ubuntu-latest
    needs: [lint, format-check, typecheck, test-unit, test-e2e, compliance-copy, deno-test]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Wait for Vercel preview deployment
        id: wait
        uses: patrickedqvist/wait-for-vercel-preview@v1.3.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          max_timeout: 300
          # Filter to the SPA project's GitHub check (RESEARCH P6 / SC#1).
          # Without this, the action returns the FIRST preview URL it finds,
          # which alphabetises to `leanshot-marketing` and causes lhci to score
          # the wrong site. Vercel's GitHub App posts one check per project;
          # this string must match the SPA project's exact check name.
          # Wave 5 verifies the exact dash character on a live PR; if this
          # value does not resolve, try `'leanshot-app - Vercel'` (hyphen).
          check_name: 'leanshot-app – Vercel'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: leanshot/package-lock.json
      - run: npm ci
      - name: Run Lighthouse against Vercel preview
        run: npx --yes @lhci/cli@0.15.1 autorun --collect.url=${{ steps.wait.outputs.url }}
        env:
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}
      - name: Assert FCP/LCP delta vs Phase 13 baseline (D-07)
        # `lhci autorun` writes lhr-*.json into ./.lighthouseci at the CI working
        # directory (repo root, where actions/checkout@v4 placed us). The script
        # reads tolerance from leanshot/.planning/phases/13-design-system-v2-rollout/13-FCP-BASELINE.json
        # (NOT hardcoded), so future phases can re-baseline by editing the JSON
        # only. Fails the PR if FCP or LCP regresses by more than tolerance_pct (5%).
        run: bash leanshot/scripts/assert-fcp-lcp-delta.sh --lhci-dir=.lighthouseci --baseline=leanshot/.planning/phases/13-design-system-v2-rollout/13-FCP-BASELINE.json
