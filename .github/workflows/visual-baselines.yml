name: Visual baselines regen

# Phase 13 Plan 13-06 D-06 — opt-in baseline regeneration. Triggers ONLY via
# manual workflow_dispatch from the Actions tab. NEVER on push or pull_request:
# baselines = the new visual normal; every regen must be a deliberate human
# decision reviewed via PR diff.
#
# After 13-02, 13-03, 13-04, 13-05 land on `main`, an operator with write
# access to the repo navigates to Actions → "Visual baselines regen" → "Run
# workflow", which regenerates all 12 baselines on CI Linux (the canonical
# baseline per D-04 — local macOS has font subpixel drift) and opens a PR for
# review.
on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are baselines being regenerated? (e.g. "13-02 Card/Button v2 refresh")'
        required: true
        type: string

defaults:
  run:
    working-directory: leanshot

jobs:
  regenerate-visual-baselines:
    name: Regenerate Phase 13 visual baselines (CI Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: leanshot/package-lock.json

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      # Production-shaped build so the preview server (port 4173) matches what
      # CI test-e2e runs against. Same env-var contract as the existing
      # test-e2e job (Phase 5 SUPABASE_* + VITE_E2E flag from Phase 7 07-01).
      - name: Build (production-shaped)
        run: npm run build
        env:
          VITE_SENTRY_DSN: ''
          VITE_POSTHOG_KEY: ''
          VITE_POSTHOG_HOST: ''
          VITE_ANALYTICS_ENABLED: 'false'
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_E2E: 'true'

      # Playwright's webServer config auto-starts `npm run preview` on port
      # 4173 with timeout 60s — see leanshot/playwright.config.ts. No
      # separate preview-start step needed.
      - name: Regenerate baselines (playwright test --update-snapshots)
        run: npx playwright test e2e/visual --update-snapshots --reporter=line
        env:
          CI: 'true'

      - name: Inspect captured baselines
        # Working directory is `leanshot/`; baselines land at
        # `leanshot/e2e/visual/__screenshots__/**/*.png` per the
        # snapshotPathTemplate set in playwright.config.ts.
        run: |
          echo "Captured baselines:"
          find e2e/visual/__screenshots__ -name '*.png' -print | sort
          echo ""
          echo "Total: $(find e2e/visual/__screenshots__ -name '*.png' | wc -l) PNGs"

      # peter-evans/create-pull-request opens (or updates) a PR carrying the
      # regenerated baselines. The default-branch operator reviews the snapshot
      # diffs visually in the PR's "Files changed" tab before merge. NEVER
      # commits directly to main.
      - name: Open PR with regenerated baselines
        uses: peter-evans/create-pull-request@v5
        with:
          # Run from repo root so the PR includes the leanshot/ path correctly.
          path: ..
          commit-message: |
            chore(visual): regenerate Phase 13 baselines

            Trigger: workflow_dispatch by ${{ github.actor }}
            Reason: ${{ github.event.inputs.reason }}
            Run: ${{ github.run_id }}
          title: 'chore(visual): regenerate Phase 13 baselines (${{ github.actor }})'
          body: |
            ## Visual baselines regeneration

            **Triggered by:** @${{ github.actor }}
            **Reason:** ${{ github.event.inputs.reason }}
            **Workflow run:** ${{ github.run_id }}

            This PR was auto-generated by the
            [`visual-baselines`](https://github.com/${{ github.repository }}/actions/workflows/visual-baselines.yml)
            workflow_dispatch. It contains regenerated PNG baselines for the
            12 Phase 13 visual-regression snapshots (D-04 / D-05).

            ### Review checklist

            - [ ] Open the "Files changed" tab and inspect every PNG diff visually
            - [ ] Confirm each visual change is intentional (matches a Phase 13
                  plan that landed on `main`, e.g. 13-02 Card/Button refresh,
                  13-03 illustrations, 13-04 split-screen auth, 13-05 marketing
                  Landing audit)
            - [ ] Verify no unrelated drift snuck in (theme leakage, font swap,
                  spurious z-index changes)
            - [ ] Merge ONLY after the operator + an additional reviewer sign off

            ### What this PR does NOT do

            - Does NOT update production. Baselines only affect the
              `test-e2e` regression gate.
            - Does NOT skip the gate on `main`. Once merged, future PRs are
              diffed against these baselines at `maxDiffPixelRatio: 0.01`.
          branch: visual-baselines/${{ github.run_id }}
          delete-branch: true
          add-paths: |
            leanshot/e2e/visual/__screenshots__/**
