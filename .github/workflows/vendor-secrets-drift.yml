name: Vendor Secrets Drift Guard

# VENDOR-07: Catches silent required-secret drift on every PR/push.
# Hard-fail set = REQUIRED_SECRETS minus DEFERRED_ALLOWLIST.
# SENTRY_DSN is specifically watched (VENDOR-07 named drift target).
# Missing deferred secrets (Phase 70 provisioning window) WARN only (exit 0).
# Closed in Phase 52 — not deferred to Phase 67.

on:
  push:
    branches: [main]
    paths:
      - 'scripts/check-required-secrets.sh'
      - 'leanshot/.planning/runbooks/vendor-secrets.md'
      - '.github/workflows/vendor-secrets-drift.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/check-required-secrets.sh'
      - 'leanshot/.planning/runbooks/vendor-secrets.md'
      - '.github/workflows/vendor-secrets-drift.yml'

concurrency:
  group: vendor-secrets-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-drift-guard:
    name: Vendor required-secrets drift guard (VENDOR-07)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || 'ytnsipxxmzgaebkqmokp' }}
      # SUPABASE_ACCESS_TOKEN is needed for `supabase secrets list` against the live project.
      # If not set, the guard falls back to name-manifest self-consistency check (exit 0).
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Run required-secrets drift guard
        run: bash scripts/check-required-secrets.sh
