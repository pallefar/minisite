<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" fill="none" aria-label="silver streak badge">
  <defs>
    <radialGradient id="silver-glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#cfd9e3" stop-opacity="0.55"></stop>
      <stop offset="60%" stop-color="#cfd9e3" stop-opacity="0"></stop>
    </radialGradient>
    <linearGradient id="silver-ring" x1="0.2" y1="0.1" x2="0.8" y2="0.9">
      <stop offset="0%" stop-color="#d5dce0"></stop>
      <stop offset="100%" stop-color="#9aa4ad"></stop>
    </linearGradient>
    <radialGradient id="silver-face" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0%" stop-color="#f1f3f5"></stop>
      <stop offset="55%" stop-color="#c2cad1"></stop>
      <stop offset="100%" stop-color="#7d8892"></stop>
    </radialGradient>
    <linearGradient id="silver-flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdfdfd"></stop>
      <stop offset="100%" stop-color="#d8e4ee"></stop>
    </linearGradient>
    <filter id="silver-inset" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6" result="blur"></feGaussianBlur>
      <feSpecularLighting in="blur" surfaceScale="2" specularConstant="0.6" specularExponent="20" lighting-color="#fff" result="spec">
        <feDistantLight azimuth="120" elevation="55"></feDistantLight>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceGraphic" operator="in"></feComposite>
    </filter>
  </defs>

  
  <circle cx="40" cy="40" r="38" fill="url(#silver-glow)"></circle>

  
  <circle cx="40" cy="40" r="34" fill="url(#silver-ring)"></circle>
  
  <circle cx="40" cy="40" r="33" fill="none" stroke="rgba(0,0,0,0.18)" stroke-width="0.4" stroke-dasharray="0.8 1.4"></circle>
  <circle cx="40" cy="40" r="35" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="0.4"></circle>

  
  <circle cx="40" cy="40" r="28" fill="url(#silver-face)"></circle>
  
  <path d="M 18 40 A 22 22 0 0 1 56 22" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1.2" stroke-linecap="round"></path>
  
  <path d="M 22 56 A 22 22 0 0 0 58 56" fill="none" stroke="rgba(0,0,0,0.18)" stroke-width="1" stroke-linecap="round"></path>

  
  <g transform="translate(40 42)">
    <path d="M 0 -14 C 5 -8 9 -4 9 2 C 9 8 5 13 0 13 C -5 13 -9 8 -9 2 C -9 -1 -7 -3 -5 -3 C -3 -3 -3 -1 -3 1 C -1 -3 -1 -9 0 -14 Z" fill="url(#silver-flame)" stroke="rgba(0,0,0,0.15)" stroke-width="0.4" stroke-linejoin="round"></path>
    
    <path d="M 0 -6 C 3 -2 5 0 5 3 C 5 7 2 9 0 9 C -2 9 -5 7 -5 3 C -5 1 -4 0 -3 0 C -2 0 -2 1 -2 2 C -1 -1 -1 -3 0 -6 Z" fill="rgba(255,255,255,0.7)"></path>
  </g>

  
  <g transform="translate(58 58)">
    <circle cx="0" cy="0" r="11" fill="#9aa4ad" stroke="#fff" stroke-width="1.4"></circle>
    <circle cx="0" cy="0" r="9" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="0.6"></circle>
    <text x="0" y="3.5" text-anchor="middle" font-family="Geist, Inter, sans-serif" font-weight="800" font-size="9" fill="#fff" letter-spacing="-0.04em">30</text>
  </g>
</svg>