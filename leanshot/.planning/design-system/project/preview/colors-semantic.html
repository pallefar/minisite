<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&display=swap">

<title>Semantic tokens</title>
<link rel="stylesheet" href="_card.css">
<style></style>
</head>
<body>
<div class="preview">

<div class="grid" style="grid-template-columns: repeat(4, 1fr); gap: 10px;">
  
    <div style="background:var(--color-info-soft); border-radius:14px; padding:14px;">
      <div style="display:flex; align-items:center; gap:8px;">
        <span style="width:14px;height:14px;border-radius:99px;background:var(--color-info);"></span>
        <span style="color:var(--color-info);font-weight:700;text-transform:uppercase;letter-spacing:0.06em;font-size:11px;">info</span>
      </div>
      <div style="margin-top:10px;color:var(--color-info);font-weight:700;font-size:13px;">Peak now</div>
      <div style="font-size:11px;color:var(--color-info);opacity:0.75;">Day 1-2 · Eat slow</div>
    </div>
    <div style="background:var(--color-success-soft); border-radius:14px; padding:14px;">
      <div style="display:flex; align-items:center; gap:8px;">
        <span style="width:14px;height:14px;border-radius:99px;background:var(--color-success);"></span>
        <span style="color:var(--color-success);font-weight:700;text-transform:uppercase;letter-spacing:0.06em;font-size:11px;">success</span>
      </div>
      <div style="margin-top:10px;color:var(--color-success);font-weight:700;font-size:13px;">Peak now</div>
      <div style="font-size:11px;color:var(--color-success);opacity:0.75;">Day 1-2 · Eat slow</div>
    </div>
    <div style="background:var(--color-warning-soft); border-radius:14px; padding:14px;">
      <div style="display:flex; align-items:center; gap:8px;">
        <span style="width:14px;height:14px;border-radius:99px;background:var(--color-warning);"></span>
        <span style="color:var(--color-warning);font-weight:700;text-transform:uppercase;letter-spacing:0.06em;font-size:11px;">warning</span>
      </div>
      <div style="margin-top:10px;color:var(--color-warning);font-weight:700;font-size:13px;">Peak now</div>
      <div style="font-size:11px;color:var(--color-warning);opacity:0.75;">Day 1-2 · Eat slow</div>
    </div>
    <div style="background:var(--color-danger-soft); border-radius:14px; padding:14px;">
      <div style="display:flex; align-items:center; gap:8px;">
        <span style="width:14px;height:14px;border-radius:99px;background:var(--color-danger);"></span>
        <span style="color:var(--color-danger);font-weight:700;text-transform:uppercase;letter-spacing:0.06em;font-size:11px;">danger</span>
      </div>
      <div style="margin-top:10px;color:var(--color-danger);font-weight:700;font-size:13px;">Peak now</div>
      <div style="font-size:11px;color:var(--color-danger);opacity:0.75;">Day 1-2 · Eat slow</div>
    </div>
</div>

</div>
</body>
</html>
