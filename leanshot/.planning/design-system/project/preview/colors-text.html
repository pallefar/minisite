<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&display=swap">

<title>Text colors</title>
<link rel="stylesheet" href="_card.css">
<style></style>
</head>
<body>
<div class="preview">

<div style="display:flex;flex-direction:column;gap:8px;">
  <div style="background:var(--color-surface);border:1px solid var(--color-border);border-radius:14px;padding:16px 20px;">
    <p style="color:var(--color-text);font-size:18px;font-weight:600;">Primary text · #16221F · headings, key values</p>
    <p style="color:var(--color-text-secondary);font-size:14px;margin-top:4px;">Secondary · #556660 · supporting copy, descriptions</p>
    <p style="color:var(--color-text-tertiary);font-size:12px;margin-top:4px;text-transform:uppercase;letter-spacing:0.08em;">Tertiary · #8D958F · labels, hints, axes</p>
  </div>
  <div style="background:var(--color-hero-bg);border-radius:14px;padding:16px 20px;">
    <p style="color:#fff;font-size:16px;font-weight:600;">On-hero · #FFFFFF · all text on dark teal</p>
    <p style="color:rgba(255,255,255,0.78);font-size:13px;margin-top:4px;">On-hero muted · rgba(255,255,255,0.78)</p>
  </div>
</div>

</div>
</body>
</html>
