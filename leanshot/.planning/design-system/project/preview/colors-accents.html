<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&display=swap">

<title>Warm accents</title>
<link rel="stylesheet" href="_card.css">
<style></style>
</head>
<body>
<div class="preview">

<div class="grid" style="grid-template-columns: repeat(5, 1fr);">
  
    <div class="swatch">
      <div class="chip" style="background:#45b077;"></div>
      <div class="meta"><span class="name">sage</span><span class="hex">#45B077 · success</span></div>
    </div>
    <div class="swatch">
      <div class="chip" style="background:#f2a893;"></div>
      <div class="meta"><span class="name">rose</span><span class="hex">#F2A893 · warm coral</span></div>
    </div>
    <div class="swatch">
      <div class="chip" style="background:#e0af4e;"></div>
      <div class="meta"><span class="name">amber</span><span class="hex">#E0AF4E · older state</span></div>
    </div>
    <div class="swatch">
      <div class="chip" style="background:#e37748;"></div>
      <div class="meta"><span class="name">orange</span><span class="hex">#E37748 · warning</span></div>
    </div>
    <div class="swatch">
      <div class="chip" style="background:#cf5454;"></div>
      <div class="meta"><span class="name">clay</span><span class="hex">#CF5454 · danger</span></div>
    </div>
    <div class="swatch">
      <div class="chip" style="background:#5ab7c7;"></div>
      <div class="meta"><span class="name">sky</span><span class="hex">#5AB7C7 · hydration</span></div>
    </div>
</div>

</div>
</body>
</html>
