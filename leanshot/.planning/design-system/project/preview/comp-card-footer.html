<body>
<div class="preview">

<div style="position:relative;background:var(--color-surface);border:1px solid var(--color-border);border-radius:24px;box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,0.55);overflow:hidden;">
  <div style="padding:20px 22px 4px;">
    <p class="eyebrow">WEEK 8 SUMMARY</p>
    <h3 style="font-size:20px;font-weight:700;margin-top:4px;letter-spacing:-0.02em;">Down 4.2 kg <span style="font-family:Fraunces,serif;font-style:italic;font-weight:300;color:var(--color-primary);">→ on track.</span></h3>
    <p style="font-size:13px;color:var(--color-text-secondary);margin-top:6px;line-height:1.5;">Protein hit 6/7 days · zero side effects logged · adherence 100%.</p>
  </div>
  <div style="margin-top:18px;padding:12px 22px;border-top:1px solid var(--color-border);display:flex;justify-content:space-between;align-items:center;background:var(--color-surface-elevated);">
    <span style="font-size:12px;color:var(--color-text-tertiary);font-weight:600;">Generated 2 hours ago</span>
    <button class="btn btn-primary btn-sm">View report →</button>
  </div>
</div>
