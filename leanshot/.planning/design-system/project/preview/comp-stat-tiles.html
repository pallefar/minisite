<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&display=swap">

<title>Stat tiles</title>
<link rel="stylesheet" href="_card.css">
<style></style>
</head>
<body>
<div class="preview">

<div class="grid" style="grid-template-columns: repeat(4, 1fr); gap:10px;">
  
    <div style="background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-card);padding:14px;">
      <div class="eyebrow">Weight</div>
      <div style="margin-top:4px;font-size:26px;font-weight:700;letter-spacing:-0.02em;line-height:1.1;" class="tnum">
        74.3<span style="font-size:12px;color:var(--color-text-secondary);font-weight:500;margin-left:4px;">kg</span>
      </div>
      <div style="margin-top:4px;font-size:11px;font-weight:600;color:var(--color-success);">-4.2</div>
    </div>
    <div style="background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-card);padding:14px;">
      <div class="eyebrow">Protein</div>
      <div style="margin-top:4px;font-size:26px;font-weight:700;letter-spacing:-0.02em;line-height:1.1;" class="tnum">
        128<span style="font-size:12px;color:var(--color-text-secondary);font-weight:500;margin-left:4px;">g</span>
      </div>
      <div style="margin-top:4px;font-size:11px;font-weight:600;color:var(--color-success);">+12</div>
    </div>
    <div style="background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-card);padding:14px;">
      <div class="eyebrow">Steps</div>
      <div style="margin-top:4px;font-size:26px;font-weight:700;letter-spacing:-0.02em;line-height:1.1;" class="tnum">
        8,402
      </div>
      <div style="margin-top:4px;font-size:11px;font-weight:600;color:var(--color-warning);">-1,103</div>
    </div>
    <div style="background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-card);padding:14px;">
      <div class="eyebrow">Water</div>
      <div style="margin-top:4px;font-size:26px;font-weight:700;letter-spacing:-0.02em;line-height:1.1;" class="tnum">
        6/8<span style="font-size:12px;color:var(--color-text-secondary);font-weight:500;margin-left:4px;">glasses</span>
      </div>
      <div style="margin-top:4px;font-size:11px;font-weight:600;color:var(--color-text-secondary);">on track</div>
    </div>
</div>

</div>
</body>
</html>
