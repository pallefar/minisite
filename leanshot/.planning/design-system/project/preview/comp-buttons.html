<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&display=swap">

<title>Buttons — variants</title>
<link rel="stylesheet" href="_card.css">
<style></style>
</head>
<body>
<div class="preview">

<style>
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 999px; font-weight: 600; font-size: 13px; border: none; cursor: pointer; white-space: nowrap; transition: all 200ms var(--ease-out-quart); }
  .btn-primary { background: linear-gradient(180deg, rgba(255,255,255,0.12), transparent 50%), var(--color-primary); color: #fff; box-shadow: var(--shadow-sm), inset 0 1px 0 rgba(255,255,255,0.18), inset 0 -1px 0 rgba(0,0,0,0.12); }
  .btn-secondary { background: transparent; color: var(--color-text); border: 1px solid var(--color-border-strong); }
  .btn-tonal { background: var(--color-primary-soft); color: var(--color-primary); }
  .btn-destructive { background: var(--color-danger); color: #fff; box-shadow: var(--shadow-sm), inset 0 1px 0 rgba(255,255,255,0.18); }
  .btn-counter { margin-left: 4px; padding: 2px 7px; border-radius: 999px; background: rgba(255,255,255,0.22); font-size: 11px; font-weight: 700; }
  .btn-secondary .btn-counter, .btn-tonal .btn-counter { background: var(--color-primary-soft); color: var(--color-primary); }
</style>
<div class="col">
  <div class="row" style="gap:8px;">
    <button class="btn btn-primary"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>Log dose</button>
    <button class="btn btn-secondary">Cancel</button>
    <button class="btn btn-tonal"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><polyline points="14 2 14 8 20 8"/><path d="M12 18v-6"/><path d="m9 15 3 3 3-3"/></svg>Export report</button>
    <button class="btn btn-destructive">Delete</button>
  </div>
  <div class="row" style="gap:8px;">
    <button class="btn btn-primary">Save<span class="btn-counter">4</span></button>
    <button class="btn btn-tonal">All<span class="btn-counter">12</span></button>
    <button class="btn btn-secondary">Filters<span class="btn-counter">2</span></button>
  </div>
</div>
<p class="eyebrow" style="margin-top:14px;">+ Tonal variant (soft-fill primary) · + counter chip for filters/quantities</p>

</div>
</body>
</html>
