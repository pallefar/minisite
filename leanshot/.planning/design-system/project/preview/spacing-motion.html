<title>Motion — easings & durations</title>
<link rel="stylesheet" href="_card.css">
<style></style>
</head>
<body>
<div class="preview">

<div class="card-demo">
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;">
    
      <div style="border:1px solid var(--color-border);border-radius:12px;padding:12px;">
        <p style="font-size:12px;font-weight:700;">ease-out-quart</p>
        <p class="tnum" style="font-size:10px;color:var(--color-text-tertiary);margin-top:2px;">cubic-bezier(0.25, 1, 0.5, 1)</p>
        <p style="font-size:11px;color:var(--color-text-secondary);margin-top:6px;">entries · most things</p>
      </div>
      <div style="border:1px solid var(--color-border);border-radius:12px;padding:12px;">
        <p style="font-size:12px;font-weight:700;">ease-in-out-quart</p>
        <p class="tnum" style="font-size:10px;color:var(--color-text-tertiary);margin-top:2px;">cubic-bezier(0.76, 0, 0.24, 1)</p>
        <p style="font-size:11px;color:var(--color-text-secondary);margin-top:6px;">state changes</p>
      </div>
      <div style="border:1px solid var(--color-border);border-radius:12px;padding:12px;">
        <p style="font-size:12px;font-weight:700;">ease-spring</p>
        <p class="tnum" style="font-size:10px;color:var(--color-text-tertiary);margin-top:2px;">cubic-bezier(0.34, 1.56, 0.64, 1)</p>
        <p style="font-size:11px;color:var(--color-text-secondary);margin-top:6px;">small pops</p>
      </div>
  </div>
  <div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;">
    <span class="badge badge-neutral"><span class="tnum">100ms</span> · instant</span><span class="badge badge-neutral"><span class="tnum">200ms</span> · quick</span><span class="badge badge-neutral"><span class="tnum">300ms</span> · standard</span><span class="badge badge-neutral"><span class="tnum">500ms</span> · deliberate</span>
  </div>
</div>

</div>
</body>
</html>
