<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&display=swap">

<title>Icon buttons</title>
<link rel="stylesheet" href="_card.css">
<style></style>
</head>
<body>
<div class="preview">

<div class="row" style="gap:16px;">
  <div class="col" style="align-items:center;gap:6px;">
    <button style="width:36px;height:36px;border-radius:12px;background:transparent;border:none;color:var(--color-text-secondary);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="m9 12 2 2 4-4"/></svg>
    </button>
    <span style="font-size:10px;color:var(--color-text-tertiary);">ghost sm</span>
  </div>
  <div class="col" style="align-items:center;gap:6px;">
    <button style="width:44px;height:44px;border-radius:12px;background:transparent;border:none;color:var(--color-text-secondary);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    </button>
    <span style="font-size:10px;color:var(--color-text-tertiary);">ghost md</span>
  </div>
  <div class="col" style="align-items:center;gap:6px;">
    <button style="width:44px;height:44px;border-radius:12px;background:var(--color-primary);border:none;color:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
    </button>
    <span style="font-size:10px;color:var(--color-text-tertiary);">solid</span>
  </div>
  <div class="col" style="align-items:center;gap:6px;background:var(--color-hero-bg);padding:8px;border-radius:12px;">
    <button style="width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,0.15);border:none;color:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.2-8.6"/><path d="M22 4 12 14.01l-3-3"/></svg>
    </button>
    <span style="font-size:10px;color:rgba(255,255,255,0.7);">inverse</span>
  </div>
</div>
<p class="eyebrow" style="margin-top:14px;">Square 36 / 44 / 48 — radius-xl (16) — aria-label required</p>

</div>
</body>
</html>
