<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&display=swap">

<title>Shadows</title>
<link rel="stylesheet" href="_card.css">
<style></style>
</head>
<body>
<div class="preview">

<div class="row" style="gap:18px;background:var(--color-bg);padding:20px 12px;border-radius:14px;">
  
    <div style="text-align:center;">
      <div style="width:80px;height:80px;background:var(--color-surface);border-radius:16px;box-shadow:0 1px 2px rgba(22,34,31,0.04);border:1px solid var(--color-border);"></div>
      <div style="font-size:11px;font-weight:700;margin-top:8px;">xs</div>
    </div>
    <div style="text-align:center;">
      <div style="width:80px;height:80px;background:var(--color-surface);border-radius:16px;box-shadow:0 2px 4px rgba(22,34,31,0.05);border:1px solid var(--color-border);"></div>
      <div style="font-size:11px;font-weight:700;margin-top:8px;">sm</div>
    </div>
    <div style="text-align:center;">
      <div style="width:80px;height:80px;background:var(--color-surface);border-radius:16px;box-shadow:0 6px 16px rgba(22,34,31,0.06);border:1px solid var(--color-border);"></div>
      <div style="font-size:11px;font-weight:700;margin-top:8px;">md</div>
    </div>
    <div style="text-align:center;">
      <div style="width:80px;height:80px;background:var(--color-surface);border-radius:16px;box-shadow:0 16px 40px rgba(22,34,31,0.10);border:1px solid var(--color-border);"></div>
      <div style="font-size:11px;font-weight:700;margin-top:8px;">lg</div>
    </div>
    <div style="text-align:center;">
      <div style="width:80px;height:80px;background:var(--color-hero-bg);border-radius:16px;box-shadow:0 24px 60px -12px rgba(15,48,44,0.45);border:1px solid transparent;"></div>
      <div style="font-size:11px;font-weight:700;margin-top:8px;">hero</div>
    </div>
</div>
<p class="eyebrow" style="margin-top:14px;">All warm (rgba(22,34,31,…)) except hero — used only on the dark teal card</p>

</div>
</body>
</html>
