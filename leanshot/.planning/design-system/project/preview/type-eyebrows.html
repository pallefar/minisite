<body>
<div class="preview">

<div class="card-demo">
  <div style="display:flex;flex-direction:column;gap:10px;">
    <div>
      <p style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--color-text-tertiary);">GLP-1 LEVEL · 7-DAY</p>
      <p style="font-size:11px;color:var(--color-text-tertiary);margin-top:2px;">10 / 700 / 0.1em — eyebrow above hero stats</p>
    </div>
    <div style="border-top:1px solid var(--color-border);padding-top:10px;">
      <p style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--color-text-secondary);">First name</p>
      <p style="font-size:11px;color:var(--color-text-tertiary);margin-top:2px;">11 / 600 / 0.06em — form field label</p>
    </div>
    <div style="border-top:1px solid var(--color-border);padding-top:10px;">
      <p style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.1em;color:#fff;background:var(--color-hero-bg);display:inline-block;padding:6px 10px;border-radius:6px;">TITRATION TIMELINE</p>
      <p style="font-size:11px;color:var(--color-text-tertiary);margin-top:4px;">on hero — same casing, white at 70-100% opacity</p>
    </div>
  </div>
</div>
