<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&display=swap">

<title>Card header convention</title>
<link rel="stylesheet" href="_card.css">
<style></style>
</head>
<body>
<div class="preview">

<div style="background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-card);padding:20px;box-shadow:var(--shadow-xs);">
  <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;">
    <div style="display:flex;align-items:center;gap:10px;">
      <span style="width:32px;height:32px;border-radius:12px;background:var(--color-surface-elevated);color:var(--color-primary);display:inline-flex;align-items:center;justify-content:center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg></span>
      <h2 style="font-size:14px;font-weight:600;">GLP-1 level</h2>
    </div>
    <span class="badge badge-success"><span style="width:6px;height:6px;border-radius:99px;background:currentColor;"></span> Peak now</span>
  </div>
  <div style="display:flex;align-items:baseline;gap:6px;">
    <span class="tnum" style="font-size:44px;font-weight:800;letter-spacing:-0.04em;">82</span>
    <span style="font-size:18px;color:var(--color-text-secondary);font-weight:700;">%</span>
    <span style="font-size:12px;color:var(--color-text-tertiary);">est.</span>
  </div>
  <p class="eyebrow" style="margin-top:14px;">32 px chip · primary on surface-elevated · title 14 / 600 · action right</p>
</div>

</div>
</body>
</html>
