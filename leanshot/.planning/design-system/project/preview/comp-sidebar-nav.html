      <button style="width:44px;height:44px;border-radius:14px;background:var(--color-primary);color:#fff;border:none;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(27,72,66,0.25);" aria-label="Today">
