<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&display=swap">

<title>Hero card — signature surface</title>
<link rel="stylesheet" href="_card.css">
<style>.preview{padding:18px;}</style>
</head>
<body>
<div class="preview">

<div style="background:var(--color-hero-bg);border-radius:24px;padding:22px;color:#fff;position:relative;overflow:hidden;box-shadow:var(--shadow-hero);min-height:220px;">
  <div style="position:absolute;inset:0;background:radial-gradient(circle at 30% 30%, rgba(168,205,196,0.36), transparent 55%), radial-gradient(circle at 70% 60%, rgba(255,255,255,0.18), transparent 50%), radial-gradient(circle at 40% 80%, rgba(243,168,147,0.16), transparent 60%);"></div>
  <img src="../assets/hero-orbital.svg" style="position:absolute;right:-50px;bottom:-60px;width:260px;height:260px;opacity:0.5;" alt="">
  <div style="position:relative;display:flex;gap:6px;flex-wrap:wrap;">
    <span class="badge badge-inverse">Mounjaro 5 mg</span>
    <span class="badge" style="background:#fff;color:var(--color-hero-bg);border:1px solid transparent;">Rx · Mounjaro</span>
  </div>
  <div style="position:relative;margin-top:14px;">
    <p style="font-family:Fraunces,serif;font-style:italic;font-weight:300;font-size:36px;line-height:1;opacity:0.95;">Lost</p>
    <p style="margin-top:2px;font-size:64px;font-weight:800;letter-spacing:-0.04em;line-height:0.92;font-variant-numeric:tabular-nums;">4.2<span style="font-size:24px;font-weight:500;opacity:0.7;margin-left:8px;">kg</span></p>
    <p style="margin-top:8px;font-size:12px;opacity:0.8;">Week 8 · Titration phase · Stay protein-focused.</p>
  </div>
</div>

</div>
</body>
</html>
