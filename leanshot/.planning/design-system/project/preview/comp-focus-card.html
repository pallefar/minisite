<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&display=swap">

<title>Focus card — pale-teal callout</title>
<link rel="stylesheet" href="_card.css">
<style></style>
</head>
<body>
<div class="preview">

<div style="background:var(--color-primary-soft);border:1px solid var(--color-primary-soft);border-radius:24px;padding:20px;">
  <div style="display:flex;align-items:flex-start;gap:14px;">
    <span style="width:48px;height:48px;border-radius:16px;background:var(--color-primary);color:#fff;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:var(--shadow-md);">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.582a.5.5 0 0 1 0 .962L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/></svg>
    </span>
    <div style="flex:1;min-width:0;">
      <p style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--color-primary);">Today's focus</p>
      <h2 style="font-size:20px;font-weight:700;letter-spacing:-0.02em;line-height:1.2;margin-top:2px;">Hit 128 g protein before 7 PM</h2>
      <p style="font-size:13px;color:var(--color-text-secondary);margin-top:6px;line-height:1.45;">You're 42 g short — a 6 oz chicken thigh or a protein shake closes the gap.</p>
    </div>
    <button class="btn btn-primary btn-sm" style="flex-shrink:0;">Log meal →</button>
  </div>
</div>

</div>
</body>
</html>
