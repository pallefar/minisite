<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&display=swap">

<title>Streak badges — 3 tiers + locked</title>
<link rel="stylesheet" href="_card.css">
<style></style>
</head>
<body>
<div class="preview">

<div style="display:flex;gap:24px;align-items:center;justify-content:space-around;padding:8px;">
  
    <div style="text-align:center;">
      <img src="../assets/streak-bronze.svg" width="80" height="80" alt="">
      <div style="margin-top:8px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--color-text);">bronze · 7d</div>
      <div style="font-size:10px;color:var(--color-text-tertiary);margin-top:2px;">first week</div>
    </div>
    <div style="text-align:center;">
      <img src="../assets/streak-silver.svg" width="80" height="80" alt="">
      <div style="margin-top:8px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--color-text);">silver · 30d</div>
      <div style="font-size:10px;color:var(--color-text-tertiary);margin-top:2px;">one month</div>
    </div>
    <div style="text-align:center;">
      <img src="../assets/streak-gold.svg" width="80" height="80" alt="">
      <div style="margin-top:8px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--color-text);">gold · 90d</div>
      <div style="font-size:10px;color:var(--color-text-tertiary);margin-top:2px;">three months</div>
    </div>
    <div style="text-align:center;">
      <img src="../assets/streak-locked.svg" width="80" height="80" alt="">
      <div style="margin-top:8px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--color-text);">locked · —</div>
      <div style="font-size:10px;color:var(--color-text-tertiary);margin-top:2px;">under 7 days</div>
    </div>
</div>

</div>
</body>
</html>
