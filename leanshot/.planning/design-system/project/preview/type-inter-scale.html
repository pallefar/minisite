<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&display=swap">

<title>Inter scale</title>

<style></style>
</head>
<body>
<div class="preview">

<div class="card-demo">
  <div style="font-family:Inter,sans-serif;display:flex;flex-direction:column;gap:8px;">
    <div style="display:flex;align-items:baseline;gap:14px;">
      <span class="eyebrow" style="width:70px;">Display</span>
      <span style="font-size:42px;font-weight:800;letter-spacing:-0.03em;line-height:1;">Lose fat.</span>
      <span class="tnum" style="margin-left:auto;font-size:11px;color:var(--color-text-tertiary);">42 / 800 / -0.03em</span>
    </div>
    <div style="display:flex;align-items:baseline;gap:14px;">
      <span class="eyebrow" style="width:70px;">H1</span>
      <span style="font-size:32px;font-weight:800;letter-spacing:-0.02em;">Today</span>
      <span class="tnum" style="margin-left:auto;font-size:11px;color:var(--color-text-tertiary);">32 / 800</span>
    </div>
    <div style="display:flex;align-items:baseline;gap:14px;">
      <span class="eyebrow" style="width:70px;">H2</span>
      <span style="font-size:22px;font-weight:700;">Week 8 · Titration</span>
      <span class="tnum" style="margin-left:auto;font-size:11px;color:var(--color-text-tertiary);">22 / 700</span>
    </div>
    <div style="display:flex;align-items:baseline;gap:14px;">
      <span class="eyebrow" style="width:70px;">H3</span>
      <span style="font-size:18px;font-weight:700;">Real pharmacology</span>
      <span class="tnum" style="margin-left:auto;font-size:11px;color:var(--color-text-tertiary);">18 / 700</span>
    </div>
    <div style="display:flex;align-items:baseline;gap:14px;">
      <span class="eyebrow" style="width:70px;">Body</span>
      <span style="font-size:15px;">Half-life curves modelled to your medication.</span>
      <span class="tnum" style="margin-left:auto;font-size:11px;color:var(--color-text-tertiary);">15 / 400</span>
    </div>
    <div style="display:flex;align-items:baseline;gap:14px;">
      <span class="eyebrow" style="width:70px;">Small</span>
      <span style="font-size:13px;color:var(--color-text-secondary);">Next shot in 2d 14h</span>
      <span class="tnum" style="margin-left:auto;font-size:11px;color:var(--color-text-tertiary);">13 / 400</span>
    </div>
  </div>
</div>

</div>
</body>
</html>
