<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&display=swap">

<title>Streaks row</title>
<link rel="stylesheet" href="_card.css">
<style></style>
</head>
<body>
<div class="preview">

<div style="background:var(--color-surface);border:1px solid var(--color-border);border-radius:24px;padding:18px;">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
    <div style="display:flex;align-items:center;gap:10px;">
      <span style="width:32px;height:32px;border-radius:12px;background:var(--color-surface-elevated);color:var(--color-primary);display:inline-flex;align-items:center;justify-content:center;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
      </span>
      <h2 style="font-size:14px;font-weight:600;">Your streaks</h2>
    </div>
    <span class="badge badge-info">Keep it going</span>
  </div>
  <div class="grid" style="grid-template-columns:repeat(4,1fr);gap:10px;">
    
      <div style="background:var(--color-surface-elevated);border:1px solid var(--color-border);border-radius:14px;padding:12px;display:flex;align-items:center;gap:12px;">
        <img src="../assets/streak-bronze.svg" width="48" height="48" alt="">
        <div>
          <p class="tnum" style="font-size:18px;font-weight:800;line-height:1;letter-spacing:-0.02em;">14<span style="font-size:11px;color:var(--color-text-secondary);font-weight:500;margin-left:3px;">days</span></p>
          <p style="font-size:9px;text-transform:uppercase;letter-spacing:0.08em;color:var(--color-text-tertiary);font-weight:700;margin-top:2px;">Weight log</p>
        </div>
      </div>
      <div style="background:var(--color-surface-elevated);border:1px solid var(--color-border);border-radius:14px;padding:12px;display:flex;align-items:center;gap:12px;">
        <img src="../assets/streak-silver.svg" width="48" height="48" alt="">
        <div>
          <p class="tnum" style="font-size:18px;font-weight:800;line-height:1;letter-spacing:-0.02em;">32<span style="font-size:11px;color:var(--color-text-secondary);font-weight:500;margin-left:3px;">days</span></p>
          <p style="font-size:9px;text-transform:uppercase;letter-spacing:0.08em;color:var(--color-text-tertiary);font-weight:700;margin-top:2px;">Protein hit</p>
        </div>
      </div>
      <div style="background:var(--color-surface-elevated);border:1px solid var(--color-border);border-radius:14px;padding:12px;display:flex;align-items:center;gap:12px;">
        <img src="../assets/streak-gold.svg" width="48" height="48" alt="">
        <div>
          <p class="tnum" style="font-size:18px;font-weight:800;line-height:1;letter-spacing:-0.02em;">92<span style="font-size:11px;color:var(--color-text-secondary);font-weight:500;margin-left:3px;">days</span></p>
          <p style="font-size:9px;text-transform:uppercase;letter-spacing:0.08em;color:var(--color-text-tertiary);font-weight:700;margin-top:2px;">Stack run</p>
        </div>
      </div>
      <div style="background:var(--color-surface-elevated);border:1px solid var(--color-border);border-radius:14px;padding:12px;display:flex;align-items:center;gap:12px;">
        <img src="../assets/streak-locked.svg" width="48" height="48" alt="">
        <div>
          <p class="tnum" style="font-size:18px;font-weight:800;line-height:1;letter-spacing:-0.02em;">5<span style="font-size:11px;color:var(--color-text-secondary);font-weight:500;margin-left:3px;">days</span></p>
          <p style="font-size:9px;text-transform:uppercase;letter-spacing:0.08em;color:var(--color-text-tertiary);font-weight:700;margin-top:2px;">Active days</p>
        </div>
      </div>
  </div>
</div>

</div>
</body>
</html>
