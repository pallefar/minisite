name: i18n Coverage + Parser Drift Gate

# Phase 32 Plan 32-02 Task 3 (D-05 / D-06).
#
# Two independent gates:
#   1. `bash scripts/check-locale-coverage.sh` — EN vs ES leaf-path diff;
#      every namespace must have identical key sets. Catches translator
#      drift (ES delivery missing a key, or stale ES key after EN
#      consolidation).
#   2. `npx i18next-parser && git diff --quiet -- public/locales` —
#      catches uncommitted catalog updates. Functionally equivalent to
#      i18next-parser's failOnUpdate but immune to the v9 sort-flag
#      false positive that appears with keepRemoved:true (see
#      i18next-parser.config.js inline justification + Plan 32-02
#      deferred-items.md).
#
# Plan 32-06 + 32-07 ship-gate sweeps will EXPAND the eslint scope (see
# eslint.config.js Plan 32-02 block) without changing this workflow.

on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  i18n-gate:
    name: i18n catalog coverage + parser drift
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: leanshot

    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth: 1 is sufficient — we only compare workdir to HEAD.
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: leanshot/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --update-sentry-capacitor

      # Gate 1 — D-05 100% per-namespace coverage gate.
      # bash scripts/check-locale-coverage.sh diffs EN vs ES leaf paths.
      - name: i18n coverage gate (D-05 / D-06 — 100% per namespace)
        run: bash scripts/check-locale-coverage.sh

      # Gate 2 — D-06 parser-drift check.
      # Run extraction, then assert public/locales is clean. Any uncommitted
      # diff means a developer added a t() call but didn't run
      # `npm run i18n:extract` before pushing.
      - name: i18n parser drift check (D-06 — fail on uncommitted catalog updates)
        run: |
          npx i18next-parser
          # Sanity: the parser run should not have produced uncommitted changes.
          if ! git diff --quiet -- public/locales; then
            echo "::error::i18n catalog drift detected — run 'npm run i18n:extract' locally and commit the changes." >&2
            git diff -- public/locales | head -100
            exit 1
          fi
          echo "i18n catalogs are clean — no parser drift."

      # Gate 3 — P58 ICU interpolation integrity guard.
      # i18next variable names are shared verbatim across locales, so the SET of
      # {{var}} tokens used in the ES catalogs must be a SUBSET of the EN set.
      # A translated variable name (e.g. {{conteo}}, {{recuento}}, {{fecha}}) has no
      # EN counterpart and would render literally in the UI, masking a dose/unit/count
      # value (T-58-01). A character-class grep cannot distinguish a translated name
      # ({{fecha}}) from an English one ({{date}}) — both are ASCII-lowercase — so we
      # compare token sets instead. Path is relative to working-directory: leanshot.
      - name: i18n ICU interpolation guard (Gate 3 — P58 no translated variable names)
        run: |
          EN_VARS=$(grep -rohE '\{\{[^}]+\}\}' public/locales/en/ 2>/dev/null | tr -d ' ' | sort -u)
          ES_VARS=$(grep -rohE '\{\{[^}]+\}\}' public/locales/es/ 2>/dev/null | tr -d ' ' | sort -u)
          OFFENDERS=$(comm -13 <(printf '%s\n' "$EN_VARS") <(printf '%s\n' "$ES_VARS"))
          if [ -n "$OFFENDERS" ]; then
            echo "::error::Gate 3 FAILED — ES catalogs use interpolation var(s) absent from EN (translated {{var}} name):"
            printf '%s\n' "$OFFENDERS" | sed 's/^/  /'
            echo "  Restore the EN variable name verbatim (e.g. {{count}}, not {{conteo}}); only translate surrounding text."
            exit 1
          fi
          echo "Gate 3 OK — every ES {{var}} token has an EN counterpart."
