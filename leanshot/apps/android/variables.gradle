ext {
    // 26 (Android 8.0), raised from 24: @capgo/capacitor-health declares minSdk 26,
    // and the manifest merger rejects an app minSdk below a library's. Health is a
    // core feature so we raise the floor rather than drop the plugin. API 26 covers
    // ~99% of active devices. (:wear keeps its own minSdkVersion 25 override.)
    minSdkVersion = 26
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
}