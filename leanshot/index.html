         Until then, social previews degrade to text-only — still better than

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Phase 2.1 perf fix: load font CSS NON-render-blocking. Preload-as-style +
      print-onload swap is the canonical pattern (Filament Group). Combined with
      `display=swap` in the URL, fallback system fonts render immediately and
      swap to Geist/Geist Mono/Fraunces once the font files arrive — without
      ever blocking FCP/LCP. The <noscript> path keeps fonts working for any
      crawler/browser without JS. (Phase 13 v2: swapped Inter+JetBrains Mono
      to Geist+Geist Mono; Fraunces unchanged. All three <link> URLs MUST stay
      byte-identical — D-10 + chat1.md landmine 2.)
    -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&display=swap"
      media="all"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&display=swap"
      />
    </noscript>
  </head>
