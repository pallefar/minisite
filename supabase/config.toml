# For detailed configuration reference documentation, visit:
# https://supabase.com/docs/guides/local-development/cli/config
# A string used to distinguish different Supabase projects on the same host. Defaults to the
# working directory name when running `supabase init`.
project_id = "minisite"

[api]
enabled = true
# Port to use for the API URL.
port = 54321
# Schemas to expose in your API. Tables, views and stored procedures in this schema will get API
# endpoints. `public` and `graphql_public` schemas are included by default.
schemas = ["public", "graphql_public"]
# Extra schemas to add to the search_path of every request.
extra_search_path = ["public", "extensions"]
# The maximum number of rows returns from a view, table, or stored procedure. Limits payload size
# for accidental or malicious requests.
max_rows = 1000

[api.tls]
# Enable HTTPS endpoints locally using a self-signed certificate.
enabled = false
# Paths to self-signed certificate pair.
# cert_path = "../certs/my-cert.pem"
# key_path = "../certs/my-key.pem"

[db]
# Port to use for the local database URL.
port = 54322
# Port used by db diff command to initialize the shadow database.
shadow_port = 54320
# Maximum amount of time to wait for health check when starting the local database.
health_timeout = "2m"
# The database major version to use. This has to be the same as your remote database's. Run `SHOW
# server_version;` on the remote database to check.
major_version = 17

[db.pooler]
enabled = false
# Port to use for the local connection pooler.
port = 54329
# Specifies when a server connection can be reused by other clients.
# Configure one of the supported pooler modes: `transaction`, `session`.
pool_mode = "transaction"
# How many server connections to allow per user/database pair.
default_pool_size = 20
# Maximum number of client connections allowed.
max_client_conn = 100

# [db.vault]
# secret_key = "env(SECRET_VALUE)"

[db.migrations]
# If disabled, migrations will be skipped during a db push or reset.
enabled = true
# Specifies an ordered list of schema files that describe your database.
# Supports glob patterns relative to supabase directory: "./schemas/*.sql"
schema_paths = []

[db.seed]
# If enabled, seeds the database after migrations during a db reset.
enabled = true
# Specifies an ordered list of seed files to load during db reset.
# Supports glob patterns relative to supabase directory: "./seeds/*.sql"
sql_paths = ["./seed.sql"]

[db.network_restrictions]
# Enable management of network restrictions.
enabled = false
# List of IPv4 CIDR blocks allowed to connect to the database.
# Defaults to allow all IPv4 connections. Set empty array to block all IPs.
allowed_cidrs = ["0.0.0.0/0"]
# List of IPv6 CIDR blocks allowed to connect to the database.
# Defaults to allow all IPv6 connections. Set empty array to block all IPs.
allowed_cidrs_v6 = ["::/0"]

# Uncomment to reject non-secure connections to the database.
# [db.ssl_enforcement]
# enabled = true

[realtime]
enabled = true
# Bind realtime via either IPv4 or IPv6. (default: IPv4)
# ip_version = "IPv6"
# The maximum length in bytes of HTTP request headers. (default: 4096)
# max_header_length = 4096

[studio]
enabled = true
# Port to use for Supabase Studio.
port = 54323
# External URL of the API server that frontend connects to.
api_url = "http://127.0.0.1"
# OpenAI API Key to use for Supabase AI in the Supabase Studio.
openai_api_key = "env(OPENAI_API_KEY)"

# Email testing server. Emails sent with the local dev setup are not actually sent - rather, they
# are monitored, and you can view the emails that would have been sent from the web interface.
[inbucket]
enabled = true
# Port to use for the email testing server web interface.
port = 54324
# Uncomment to expose additional ports for testing user applications that send emails.
# smtp_port = 54325
# pop3_port = 54326
# admin_email = "admin@email.com"
# sender_name = "Admin"

[storage]
enabled = true
# The maximum file size allowed (e.g. "5MB", "500KB").
file_size_limit = "50MiB"

# Uncomment to configure local storage buckets
# [storage.buckets.images]
# public = false
# file_size_limit = "50MiB"
# allowed_mime_types = ["image/png", "image/jpeg"]
# objects_path = "./images"

# Allow connections via S3 compatible clients
[storage.s3_protocol]
enabled = true

# Image transformation API is available to Supabase Pro plan.
# [storage.image_transformation]
# enabled = true

# Store analytical data in S3 for running ETL jobs over Iceberg Catalog
# This feature is only available on the hosted platform.
[storage.analytics]
enabled = false
max_namespaces = 5
max_tables = 10
max_catalogs = 2

# Analytics Buckets is available to Supabase Pro plan.
# [storage.analytics.buckets.my-warehouse]

# Store vector embeddings in S3 for large and durable datasets
# This feature is only available on the hosted platform.
[storage.vector]
enabled = false
max_buckets = 10
max_indexes = 5

# Vector Buckets is available to Supabase Pro plan.
# [storage.vector.buckets.documents-openai]

[auth]
enabled = true
# The base URL of your website. Used as an allow-list for redirects and for constructing URLs used
# in emails.
# Phase 5 G1 (Plan 05-04): production SPA URL — gap closure for 05-UAT.md Test 9.
# Previously the Supabase init default `http://127.0.0.1:3000` silently overrode every
# email-link `redirect_to` not in the allowlist below, breaking real-user email verify
# + password reset (SC#1 first leg + SC#2).
site_url = "https://leanshot-app.vercel.app"
# The public URL that Auth serves on. Defaults to the API external URL with `/auth/v1` appended.
# external_url = ""
# A list of *exact* URLs that auth providers are permitted to redirect to post authentication.
# Phase 5 G1: the four-environment allowlist per 05-02-SUMMARY "Auth gates encountered".
# Glob suffix `/**` lets Supabase match any sub-path under the host (including hash routes
# like `/#/auth/verify` and `/#/auth/set-new-password`).
additional_redirect_urls = [
  "http://localhost:5173/**",
  "http://localhost:4173/**",
  "https://leanshot-app.vercel.app/**",
  "https://*-karstens-projects-16afd0e4.vercel.app/**",
]
# How long tokens are valid for, in seconds. Defaults to 3600 (1 hour), maximum 604,800 (1 week).
jwt_expiry = 3600
# JWT issuer URL. If not set, defaults to auth.external_url.
# jwt_issuer = ""
# Path to JWT signing key. DO NOT commit your signing keys file to git.
# signing_keys_path = "./signing_keys.json"
# If disabled, the refresh token will never expire.
enable_refresh_token_rotation = true
# Allows refresh tokens to be reused after expiry, up to the specified interval in seconds.
# Requires enable_refresh_token_rotation = true.
refresh_token_reuse_interval = 10
# Allow/disallow new user signups to your project.
enable_signup = true
# Allow/disallow anonymous sign-ins to your project.
enable_anonymous_sign_ins = true
# Allow/disallow testing manual linking of accounts
enable_manual_linking = true
# Passwords shorter than this value will be rejected as weak. Minimum 6, recommended 8 or more.
# Phase 5 CONF-1 (Plan 05-02 Task 5): tightened from 6 → 8 to match the health-app threat model.
minimum_password_length = 8
# Passwords that do not meet the following requirements will be rejected as weak. Supported values
# are: `letters_digits`, `lower_upper_letters_digits`, `lower_upper_letters_digits_symbols`
# Phase 5 CONF-1: require letters + digits (matches client-side regex /^(?=.*\d).{8,}$/).
password_requirements = "letters_digits"

# Configure passkey sign-ins.
# [auth.passkey]
# enabled = false

# Configure WebAuthn relying party settings (required when passkey is enabled).
# [auth.webauthn]
# rp_display_name = "Supabase"
# rp_id = "localhost"
# rp_origins = ["http://127.0.0.1:3000"]

[auth.rate_limit]
# Number of emails that can be sent per hour. Requires auth.email.smtp to be enabled.
email_sent = 2
# Number of SMS messages that can be sent per hour. Requires auth.sms to be enabled.
sms_sent = 30
# Number of anonymous sign-ins that can be made per hour per IP address. Requires enable_anonymous_sign_ins = true.
anonymous_users = 30
# Number of sessions that can be refreshed in a 5 minute interval per IP address.
token_refresh = 150
# Number of sign up and sign-in requests that can be made in a 5 minute interval per IP address (excludes anonymous users).
sign_in_sign_ups = 30
# Number of OTP / Magic link verifications that can be made in a 5 minute interval per IP address.
token_verifications = 30
# Number of Web3 logins that can be made in a 5 minute interval per IP address.
web3 = 30

# Configure one of the supported captcha providers: `hcaptcha`, `turnstile`.
# [auth.captcha]
# enabled = true
# provider = "hcaptcha"
# secret = ""

[auth.email]
# Allow/disallow new user signups via email to your project.
enable_signup = true
# If enabled, a user will be required to confirm any email change on both the old, and new email
# addresses. If disabled, only the new email is required to confirm.
double_confirm_changes = true
# If enabled, users need to confirm their email address before signing in.
enable_confirmations = true
# If enabled, users will need to reauthenticate or have logged in recently to change their password.
secure_password_change = false
# Controls the minimum amount of time that must pass before sending another signup confirmation or password reset email.
max_frequency = "1m0s"
# Number of characters used in the email OTP.
otp_length = 8
# Number of seconds before the email OTP expires (defaults to 1 hour).
otp_expiry = 3600

# Use a production-ready SMTP server
# [auth.email.smtp]
# enabled = true
# host = "smtp.sendgrid.net"
# port = 587
# user = "apikey"
# pass = "env(SENDGRID_API_KEY)"
# admin_email = "admin@email.com"
# sender_name = "Admin"

# Uncomment to customize email template
# [auth.email.template.invite]
# subject = "You have been invited"
# content_path = "./supabase/templates/invite.html"

# Uncomment to customize notification email template
# [auth.email.notification.password_changed]
# enabled = true
# subject = "Your password has been changed"
# content_path = "./templates/password_changed_notification.html"

[auth.sms]
# Allow/disallow new user signups via SMS to your project.
enable_signup = false
# If enabled, users need to confirm their phone number before signing in.
enable_confirmations = false
# Template for sending OTP to users
template = "Your code is {{ .Code }}"
# Controls the minimum amount of time that must pass before sending another sms otp.
max_frequency = "5s"

# Use pre-defined map of phone number to OTP for testing.
# [auth.sms.test_otp]
# 4152127777 = "123456"

# Configure logged in session timeouts.
# [auth.sessions]
# Force log out after the specified duration.
# timebox = "24h"
# Force log out if the user has been inactive longer than the specified duration.
# inactivity_timeout = "8h"

# This hook runs before a new user is created and allows developers to reject the request based on the incoming user object.
# [auth.hook.before_user_created]
# enabled = true
# uri = "pg-functions://postgres/auth/before-user-created-hook"

# This hook runs before a token is issued and allows you to add additional claims based on the authentication method used.
# [auth.hook.custom_access_token]
# enabled = true
# uri = "pg-functions://<database>/<schema>/<hook_name>"

# Configure one of the supported SMS providers: `twilio`, `twilio_verify`, `messagebird`, `textlocal`, `vonage`.
[auth.sms.twilio]
enabled = false
account_sid = ""
message_service_sid = ""
# DO NOT commit your Twilio auth token to git. Use environment variable substitution instead:
auth_token = "env(SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN)"

# Multi-factor-authentication is available to Supabase Pro plan.
[auth.mfa]
# Control how many MFA factors can be enrolled at once per user.
max_enrolled_factors = 10

# Control MFA via App Authenticator (TOTP)
[auth.mfa.totp]
enroll_enabled = false
verify_enabled = false

# Configure MFA via Phone Messaging
[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false
otp_length = 6
template = "Your code is {{ .Code }}"
max_frequency = "5s"

# Configure MFA via WebAuthn
# [auth.mfa.web_authn]
# enroll_enabled = true
# verify_enabled = true

# Use an external OAuth provider. The full list of providers are: `apple`, `azure`, `bitbucket`,
# `discord`, `facebook`, `github`, `gitlab`, `google`, `keycloak`, `linkedin_oidc`, `notion`, `twitch`,
# `twitter`, `x`, `slack`, `spotify`, `workos`, `zoom`.
[auth.external.apple]
enabled = false
client_id = ""
# DO NOT commit your OAuth provider secret to git. Use environment variable substitution instead:
secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"
# Overrides the default auth callback URL derived from auth.external_url.
redirect_uri = ""
# Overrides the default auth provider URL. Used to support self-hosted gitlab, single-tenant Azure,
# or any other third-party OIDC providers.
url = ""
# If enabled, the nonce check will be skipped. Required for local sign in with Google auth.
skip_nonce_check = false
# If enabled, it will allow the user to successfully authenticate when the provider does not return an email address.
email_optional = false

# Allow Solana wallet holders to sign in to your project via the Sign in with Solana (SIWS, EIP-4361) standard.
# You can configure "web3" rate limit in the [auth.rate_limit] section and set up [auth.captcha] if self-hosting.
[auth.web3.solana]
enabled = false

# Use Firebase Auth as a third-party provider alongside Supabase Auth.
[auth.third_party.firebase]
enabled = false
# project_id = "my-firebase-project"

# Use Auth0 as a third-party provider alongside Supabase Auth.
[auth.third_party.auth0]
enabled = false
# tenant = "my-auth0-tenant"
# tenant_region = "us"

# Use AWS Cognito (Amplify) as a third-party provider alongside Supabase Auth.
[auth.third_party.aws_cognito]
enabled = false
# user_pool_id = "my-user-pool-id"
# user_pool_region = "us-east-1"

# Use Clerk as a third-party provider alongside Supabase Auth.
[auth.third_party.clerk]
enabled = false
# Obtain from https://clerk.com/setup/supabase
# domain = "example.clerk.accounts.dev"

# OAuth server configuration
[auth.oauth_server]
# Enable OAuth server functionality
enabled = false
# Path for OAuth consent flow UI
authorization_url_path = "/oauth/consent"
# Allow dynamic client registration
allow_dynamic_registration = false

[edge_runtime]
enabled = true
# Supported request policies: `oneshot`, `per_worker`.
# `per_worker` (default) — enables hot reload during local development.
# `oneshot` — fallback mode if hot reload causes issues (e.g. in large repos or with symlinks).
policy = "per_worker"
# Port to attach the Chrome inspector for debugging edge functions.
inspector_port = 8083
# The Deno major version to use.
deno_version = 2

# [edge_runtime.secrets]
# secret_key = "env(SECRET_VALUE)"

# Stripe calls this endpoint with a Stripe signature header, NOT a Supabase JWT.
# verify_jwt must be false or every delivery is rejected with 401 at the gateway
# before the function runs. App-invoked functions keep the default verify_jwt = true.
[functions.stripe-webhook]
verify_jwt = false

# Phase 16 Plan 06 — RevenueCat posts webhook events with a Bearer auth token
# (REVENUECAT_WEBHOOK_AUTH) + optional HMAC-SHA256 signature header
# (REVENUECAT_WEBHOOK_SECRET), NOT a Supabase user JWT. verify_jwt must be false
# or every RC delivery is rejected with 401 at the gateway before the function
# runs. The function enforces its own Bearer + (optional) HMAC gates internally.
[functions.revenuecat-webhook]
verify_jwt = false

# Phase 15 Plan 03 — page-render is a PUBLIC endpoint for published landing pages.
# Anonymous visitors (and search-engine crawlers) request /{slug}; no JWT, no
# cookie. Without verify_jwt = false the gateway 401s every visitor before the
# function runs (RESEARCH Pitfall 7 / T-15-03-06). The function's own
# `status='published'` SELECT filter is the access-control gate.
[functions.page-render]
verify_jwt = false

# Phase 15 Plan 04 — page-save mutates landing_pages + landing_page_revisions
# under an is_staff gate. JWT is required (verify_jwt = true, the default) AND
# the function independently re-verifies profiles.is_staff via the service-role
# client (T-15-04-01). Append-only invariant on landing_page_revisions is
# enforced by both function code and DB-level triggers (Plan 15-01).
[functions.page-save]
verify_jwt = true

# Phase 15 Plan 04 — page-publish re-points landing_pages.published_revision_id
# and fires a best-effort x-prerender-revalidate HEAD. Same is_staff posture as
# page-save (verify_jwt = true + server-side profiles.is_staff check).
[functions.page-publish]
verify_jwt = true

# Phase 15 Plan 07 — lead-capture is a public form-POST endpoint for the native
# lead-form block (D-12). Visitors are unauthenticated; verify_jwt must be false
# or the gateway 401s every form submit before the function runs. The function's
# own spam guards are the honeypot field + per-IP rate-limit (5 per 15 min) +
# email regex validation; the service-role insert into `public.leads` is the
# data path. RLS on `leads` (migration 20261101000007) is the read-side gate.
[functions.lead-capture]
verify_jwt = false

# Phase 15 Plan 08 — sitemap is a public crawler endpoint serving sitemap.xml
# for every PUBLISHED landing page. Search engines (Google, Bing) request
# /sitemap.xml; 15-02's vercel.json rewrites that path to /functions/v1/sitemap.
# verify_jwt must be false or the gateway 401s every crawler before the
# function runs (Pitfall 7). The function's `status='published'` filter is
# the access-control gate (T-15-08-03); draft slugs are NEVER served.
[functions.sitemap]
verify_jwt = false

# Phase 19 Plan 19-02 — affiliate-attribute is the public cookie-set endpoint
# at /r/{code} (fronted by Vercel rewrite per D-37 #1). Visitors are
# unauthenticated; verify_jwt MUST be false or the gateway 401s every click
# before the function runs. The function's own gates are the referral-code
# regex (^[a-z0-9-]{4,80}$), the affiliates.status='approved' filter (D-25
# silently no-ops non-approved codes), the per-affiliate Referer-host
# allowlist (D-28), and the 7-day / 500-clicks-per-day cold-start cap (D-27).
# All clicks are recorded into public.affiliate_clicks; flagged=true clicks
# skip the Set-Cookie (attribution suppressed) but still write a click row.
#
# BL-4 ordering note (iter-1 revision 2026-05-15): this block is the FIRST
# Wave-1 writer of supabase/config.toml. Plan 19-03 depends_on:[2] and
# appends its own [functions.stripe-connect-onboard] block AFTER this one.
# Plan 19-05 + 19-06 + 19-09 follow the same chain.
[functions.affiliate-attribute]
verify_jwt = false

# Phase 19 Plan 19-03 — stripe-connect-onboard is the JWT-gated POST endpoint
# that mints Stripe Connect Express account_link.url onboarding URLs for
# approved affiliates (D-25). Defensive explicit verify_jwt = true even though
# it's the default ([[reference-supabase-edge-function-deploy]]). The function
# resolves the Bearer JWT via admin.auth.getUser, gates on affiliates.status =
# 'approved', and never persists the account_link.url (Pitfall 6: 5-min TTL,
# JIT generation per call). accounts.create requests capabilities.transfers
# (D-37 #2 — load-bearing for Plan 19-09's transfers.create cron).
[functions.stripe-connect-onboard]
verify_jwt = true

# Phase 19 Plan 19-03 — partner-account-status is the JWT-gated GET endpoint
# that drives the partner-dashboard onboarding card's state machine (Plan
# 19-06). It calls accounts.retrieve and derives a 4-state value (pending /
# needs_info / active / restricted) from Stripe's requirements + capability
# flags. It also mirrors acct.payouts_enabled onto affiliates.stripe_payouts_enabled
# so Plan 19-09's monthly cron can filter without an extra Stripe roundtrip
# (Pitfall 7).
[functions.partner-account-status]
verify_jwt = true

# Phase 19 Plan 19-05 — affiliate-apply is the PUBLIC unauthenticated POST
# endpoint serving the /affiliate apply form (D-05 + AFF-05). verify_jwt =
# false because the form is anonymous-visitor-facing; spam-defense is the
# honeypot field + per-IPv4-/24 rate-limit (5/15min) implemented in
# index.ts, NOT JWT validation. Service-role admin client inserts into
# `affiliates` (bypasses RLS; Plan 19-01 staff_all policy gates SELECT).
# Resend dispatch uses direct HTTPS POST to api.resend.com/emails (W-5;
# clones clinic-invite/resend.ts — NO npm:resend SDK).
[functions.affiliate-apply]
verify_jwt = false

# Phase 19 Plan 19-06b — partner-profile-update is the JWT-gated POST endpoint
# that affiliates use to self-edit their `affiliates` row (BL-2 Path A). It
# enforces a 6-column allowlist server-side (display_name, photo_path, blurb,
# calendly_url, testimonial_quote, template_choice) — Postgres RLS cannot
# restrict UPDATE on a per-column basis, so this Edge Function is the canonical
# write gate. verify_jwt = true is explicit (also the default). user.id is
# resolved from the Bearer JWT server-side; the WHERE clause never trusts the
# request body. Per-user rate limit (10 saves / 60s) in index.ts.
[functions.partner-profile-update]
verify_jwt = true

# Phase 19 Plan 19-08 — affiliate-impression is the PUBLIC fire-and-forget POST
# endpoint fired from /r/{code}/landing on mount (D-38 / BL-8). Visitors are
# anonymous; verify_jwt MUST be false or the gateway 401s every impression
# ping before the function runs. Defenses are stacked in index.ts:
#   - per-IPv4-/24 in-memory rate limit (10 / 60s) — same pattern as
#     affiliate-attribute + affiliate-apply
#   - affiliate-existence + status='approved' check (silent 200 on miss —
#     never reveal whether an affiliate_id is valid)
#   - body validation: UUID-shape affiliate_id, 64-hex ua_hash, ≤500-char referer
# The function calls `public.insert_affiliate_impression(uuid, text, text, text)`
# (Plan 19-01 migration 20270101000004a, SECURITY DEFINER) which applies
# `set_masklen(p_ip::inet, 24)` server-side — the raw IP is never persisted.
[functions.affiliate-impression]
verify_jwt = false

# Phase 19 Plan 19-09 — affiliate-payout is the cron-invoked POST endpoint that
# fires on the 1st of each month at 00:00 UTC (AFF-06). It iterates eligible
# pending payouts and calls stripe.transfers.create per affiliate with an
# idempotency key (D-32). verify_jwt = true at the GATEWAY level + constant-time
# bearer compare against SUPABASE_SERVICE_ROLE_KEY inside the function. The
# bearer is sourced by pg_cron from vault.decrypted_secrets (BL-7 — migration
# 20270101000013). Stripe pin: stripe@19 (W-2 lock from Phase 14 + 19-04).
# Skips on `stripe_payouts_enabled = false` (Pitfall 7) → status='blocked_onboarding'.
# Skips when cumulative paid + this amount < tax_threshold_cents (D-31 W-9).
# On Stripe error → incrementPayoutRetry; 3 attempts then status='failed' +
# Resend admin alert.
[functions.affiliate-payout]
verify_jwt = true

# Phase 19 Plan 19-09 — account-delete is the JWT-gated POST endpoint that
# orchestrates the D-33 10-step cascade (AFF-10 + MONEY-10). Caller must be the
# user being deleted (caller.user.id === p_user_id) OR is_staff(caller). 409
# response with { error: 'open_payouts', eta } when pre-flight finds pending or
# processing payouts. SQL function finalize_affiliate_cascade (migration
# 20270101000012) handles steps 2-4 (anonymize, audit-skeleton); the Edge
# Function orchestrates steps 5-10 (Stripe customer.del, Stripe Connect
# accounts.del, PaymentIntent cancel, Resend audience.remove, Storage cleanup,
# auth.admin.deleteUser). payouts rows are RETAINED (IRS 7yr); event tables
# use FK ON DELETE SET NULL on user_id.
[functions.account-delete]
verify_jwt = true

# Phase 41 Plan 41-04 EMBED-08 — calendly-oauth-start is the popup-OAuth entry
# point opened via `window.open('/api/calendly/oauth-start', ...)` from the
# PageEditor inline-preview surface. The popup-window navigation is a top-level
# browser request — Supabase's browser SDK stores the session in localStorage
# (not as a cookie), so NO Authorization header / cookie is auto-attached to
# the cross-origin popup. verify_jwt MUST be false here or the Supabase gateway
# 401s every popup before handleStart() runs (CR-02 in 41-REVIEW.md).
#
# KNOWN ISSUE: the current handleStart() implementation expects an explicit
# `Authorization: Bearer <jwt>` header (jwtFromReq) which a popup navigation
# cannot provide. The user-identity flow needs to migrate to a signed-handoff
# token (minted by an in-app fetch BEFORE window.open, validated by handleStart)
# OR a separate cookie-set step. Tracked for a follow-up phase — until then the
# popup flow is non-functional even with verify_jwt = false, but the toml entry
# is a prerequisite for any subsequent fix.
[functions.calendly-oauth-start]
verify_jwt = false

# Phase 41 Plan 41-04 EMBED-08 — calendly-oauth-callback receives Calendly's
# redirect at the end of the OAuth flow. Calendly redirects the popup directly
# from `auth.calendly.com` to the redirect_uri; the request carries Calendly's
# `?code=&state=` but NO LeanShot JWT. verify_jwt MUST be false or the gateway
# 401s every redirect before handleCallback() runs (CR-02 in 41-REVIEW.md).
# CSRF defense is the in-Fn HMAC verifyState() check (T-41-04-05) + 10-min
# expiry — NOT the JWT.
[functions.calendly-oauth-callback]
verify_jwt = false

# Phase 42 Plan 42-01 — spike-web-push is a DISPOSABLE spike Edge Fn that proves
# VAPID ECDSA P-256 + Web Push works inside Deno. Invoked via curl from a developer
# shell with no Supabase user JWT, so verify_jwt = false. WILL BE DELETED in Wave 4
# (plan 42-11) — also remove this block at that time.
#
# Note: original plan called this `_spike_web_push` but Supabase Fn name regex
# `^[A-Za-z][A-Za-z0-9_-]*$` rejects leading underscores; renamed to spike-web-push
# (Rule 3 auto-fix during Plan 42-01 Task 2 execution).
[functions.spike-web-push]
verify_jwt = false

[analytics]
enabled = true
port = 54327
# Configure one of the supported backends: `postgres`, `bigquery`.
backend = "postgres"

# Experimental features may be deprecated any time
[experimental]
# Configures Postgres storage engine to use OrioleDB (S3)
orioledb_version = ""
# Configures S3 bucket URL, eg. <bucket_name>.s3-<region>.amazonaws.com
s3_host = "env(S3_HOST)"
# Configures S3 bucket region, eg. us-east-1
s3_region = "env(S3_REGION)"
# Configures AWS_ACCESS_KEY_ID for S3 bucket
s3_access_key = "env(S3_ACCESS_KEY)"
# Configures AWS_SECRET_ACCESS_KEY for S3 bucket
s3_secret_key = "env(S3_SECRET_KEY)"

# [experimental.pgdelta]
# When enabled, pg-delta becomes the active engine for supported schema flows.
# enabled = false
# Directory under `supabase/` where declarative files are written.
# declarative_schema_path = "./database"
# JSON string passed through to pg-delta SQL formatting.
# format_options = "{\"keywordCase\":\"upper\",\"indent\":2,\"maxWidth\":80,\"commaStyle\":\"trailing\"}"
